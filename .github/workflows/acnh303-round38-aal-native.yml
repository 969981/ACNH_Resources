name: ACNH R38 Exact Native ELF BgmBase AAL Name Argument DefUse
on:
  push:
    branches: [feat/acnh303-round38-native-animation-aal-stream-closure]
    paths:
      - '.github/workflows/acnh303-round38-aal-native.yml'
      - 'scripts/acnh303_round38_aal_native_defuse.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  defuse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /scripts/
            /e10617820db06889e1638499478da0de_NCA/0/ACNH3.0.3.elf
          sparse-checkout-cone-mode: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'capstone>=5,<6'
      - name: Reconstruct original actual Bgm_Base pointer passing to direct BL call and static name table
        run: |
          python scripts/acnh303_round38_aal_native_defuse.py \
            --elf e10617820db06889e1638499478da0de_NCA/0/ACNH3.0.3.elf \
            --out derived/3.0.3/r38_aal_native/real_bgm_pointer_static_defuse.json
          python - <<'PY'
          import json
          x=json.load(open('derived/3.0.3/r38_aal_native/real_bgm_pointer_static_defuse.json'))
          assert x['concrete_source_name_pointer']=='0x3ffadb9'
          assert x['site_1_function_argument_flow']['name_pointer_field_offset_within_x1_struct']=='+0x18'
          assert x['native_actual_file_open_captured'] is False
          print('R38_ACTUAL_STATIC_STRING_ARGUMENT_PASS_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r38-native-ELF-Bgm_Base-parameter-register-defuse
          path: derived/3.0.3/r38_aal_native/
      - name: Commit only verified ELF instruction evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse derived/3.0.3/r38_aal_native/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(r38): original AArch64 BgmBase pointer, x1+18h name field and table proof'
          for n in 1 2 3 4 5 6; do
            git fetch origin feat/acnh303-round38-native-animation-aal-stream-closure
            git rebase FETCH_HEAD
            if git push origin HEAD:feat/acnh303-round38-native-animation-aal-stream-closure; then exit 0; fi
            sleep 2
          done
          exit 1
