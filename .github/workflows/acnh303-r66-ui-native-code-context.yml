name: ACNH 3.0.3 | R66 ARM64 UI icon family code windows and GDB guide
on:
  push:
    branches: [3.0.3_Unpack]
    paths:
      - 'Scripts/acnh303_r66_ui_native_code_windows.py'
      - '.github/workflows/acnh303-r66-ui-native-code-context.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: acnh303-r66-original-native-UI-family
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/acnh303_r66_ui_native_code_windows.py
            /assets/evidence/rom-ui-semantics/
            /e10617820db06889e1638499478da0de_NCA/0/ACNH3.0.3.elf
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verified disassembler
        run: python -m pip install capstone
      - name: Disassemble four actual ADRP ADD sites from verified original ELF
        run: python Scripts/acnh303_r66_ui_native_code_windows.py
      - name: Commit read-only instruction evidence and GDB guide
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -A -- assets/evidence/rom-ui-semantics/r66-ui-native-ARM64-ref-windows.json assets/evidence/rom-ui-semantics/r66-ui-native-ARM64-ref-windows.csv docs/ACNH303_R66_READ_ONLY_GDB_UI_FAMILY_TRACE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'evidence: disassemble original ACNH ARM64 UI-family refs and prepare read-only GDB'
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin 3.0.3_Unpack
            if ! git rebase origin/3.0.3_Unpack; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:3.0.3_Unpack; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
