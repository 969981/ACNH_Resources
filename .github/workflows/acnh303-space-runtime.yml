name: ACNH native placement arithmetic replay
on:
  pull_request:
    branches: [3.0.3]
    paths:
      - 'Scripts/acnh303_space_runtime_probe.py'
      - '.github/workflows/acnh303-space-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/acnh303_furniture_space.py
            /Scripts/acnh303_space_runtime_probe.py
            /e10617820db06889e1638499478da0de_NCA/1/Bcsv/ItemParam.bcsv
            /e10617820db06889e1638499478da0de_NCA/1/Bcsv/ItemSize.bcsv
      - uses: actions/checkout@v4
        with:
          repository: 969981/ACNH_Resources
          ref: b17b413c7344b85f46beb620f636ac98d6e988ba
          path: verified-tools
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/
            /e10617820db06889e1638499478da0de_NCA/0/main
            /e10617820db06889e1638499478da0de_NCA/0/main.elf
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lz4==4.4.4 capstone==5.0.6 unicorn==2.1.4
      - run: PYTHONPATH="$PWD/verified-tools/Scripts" python Scripts/acnh303_space_runtime_probe.py --verified verified-tools --out result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-placement-replay
          path: result/
          if-no-files-found: warn
