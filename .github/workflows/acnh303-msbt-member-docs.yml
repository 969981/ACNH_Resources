name: ACNH MSBT original member documentation
on:
  workflow_dispatch:
  push:
    branches: [research]
    paths:
      - 'Scripts/message/member_docs.py'
      - 'Scripts/message/member_pages.py'
      - 'research/message-data/manifest.json'
      - 'docs/Sources/Message/String-Member-Index.md'
      - '.github/workflows/acnh303-msbt-member-docs.yml'
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Scripts/message
            docs
            research/message-data/archive.csv
            research/message-data/member.csv
            research/message-data/manifest.json
            research/message-data/summary.json
            research/message-data/entries
          sparse-checkout-cone-mode: false
      - run: python3 Scripts/message/member_pages.py
      - uses: actions/upload-artifact@v4
        with:
          name: msbt-member-docs
          path: |
            docs/Sources/Message/Members
            research/message-data/member-purpose-index.json
      - name: Publish verified documentation
        run: |
          set -euo pipefail
          git add --sparse docs/Sources/Message/Members research/message-data/member-purpose-index.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'docs(msbt): publish 3086 individual original-file notes'
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin research
            git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- Scripts/message/member_docs.py Scripts/message/member_pages.py research/message-data/manifest.json docs/Sources/Message/String-Member-Index.md || { echo "Source inputs changed; refusing stale output"; exit 1; }
            git rebase FETCH_HEAD
            if git push origin HEAD:research; then exit 0; fi
          done
          exit 1
