name: ACNH 3.0.3 Publish Actual EventFlow Graph JSON
on:
  push:
    branches: [feat/acnh303-assets-eventflow]
    paths:
      - ".github/workflows/acnh303-publish-eventflow.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            Unpack
            derived
            e10617820db06889e1638499478da0de_NCA/1/EventFlow
          sparse-checkout-cone-mode: true
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r scripts/requirements.txt evfl
      - name: Decode every 3.0.3 EventFlow including actors branches entrypoints parameters
        shell: bash
        run: |
          set +e
          python scripts/acnh303_asset_batch.py \
            --group EventFlow --root . --out Unpack \
            --report-dir derived/3.0.3/eventflow --batch-id complete --raw-limit-mb 0
          code=$?
          set -e
          echo "Parser exit status: $code"
          python - <<'PY'
          import json,pathlib
          summary=json.loads(pathlib.Path("derived/3.0.3/eventflow/EventFlow/complete/summary.json").read_text("utf-8"))
          print("EventFlow conversion summary:",json.dumps(summary,ensure_ascii=False))
          assert summary["processed"] == 877, "EventFlow source count mismatch"
          PY
      - name: Commit verified EventFlow graphs and per-file parser failures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+969981@users.noreply.github.com"
          git add -A Unpack/e10617820db06889e1638499478da0de_NCA/1/EventFlow derived/3.0.3/eventflow
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(acnh303): publish genuine EventFlow graph JSON and source manifest"
          git push origin HEAD:feat/acnh303-assets-eventflow
