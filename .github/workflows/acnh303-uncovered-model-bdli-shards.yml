name: ACNH 3.0.3 | Unrepresented Model L3 and BDLI LBLI source shards

on:
  pull_request:
    paths:
      - 'Scripts/acnh303_uncovered_model_bdli_wave.py'
      - 'Scripts/acnh303_uncovered_wave_ledger.py'
      - 'Scripts/test_acnh303_uncovered_model_bdli_wave.py'
      - 'Scripts/acnh303_history_sha_merge.py'
      - 'docs/22-Unrepresented-Model-BDLI-Real-Source-Shards.md'
      - '.github/workflows/acnh303-uncovered-model-bdli-shards.yml'
  push:
    branches: [3.0.3_Unpack]
    paths:
      - '.github/workflows/acnh303-uncovered-model-bdli-shards.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: acnh303-verified-unrepresented-model-bdli
  cancel-in-progress: false

jobs:
  two-independent-real-shards:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Sparse checkout real source selector, CI importer and persisted SHA ledger
        uses: actions/checkout@v4
        with:
          filter: blob:none
          persist-credentials: true
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/
            /UnPack/_meta/history_sha_merge/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real BFRES/BNTX and BDLI parsing requirements
        run: python -m pip install -r Scripts/requirements-media.txt
      - name: Unit and anti-fabrication regression gates
        run: |
          python -m compileall -q Scripts
          python -m unittest discover -s Scripts -p 'test_acnh303_uncovered_model_bdli_wave.py' -v
          python -m unittest discover -s Scripts -p 'test_acnh303_priority_model_bdli.py' -v
          python -m unittest discover -s Scripts -p 'test_acnh303_media_l3.py' -v
      - name: Download hash-verified real BFRES and PNG converters
        shell: bash
        run: |
          set -euo pipefail
          u=https://github.com/quatric/nintoolbox/releases/download/nightly-20261028
          curl -fLsS --retry 3 "$u/nintoolbox-linux-x86_64.tar.gz" -o /tmp/nintoolbox-linux-x86_64.tar.gz
          curl -fLsS --retry 3 "$u/SHA256SUMS.txt" -o /tmp/SHA256SUMS.txt
          (cd /tmp && grep 'nintoolbox-linux-x86_64.tar.gz$' SHA256SUMS.txt | sha256sum -c -)
          mkdir -p /tmp/nintoolbox
          tar -xzf /tmp/nintoolbox-linux-x86_64.tar.gz -C /tmp/nintoolbox
          for tool in wmdlt wimgt; do
            find /tmp/nintoolbox -type f -name "$tool" -print -quit > "/tmp/$tool.path"
            test -s "/tmp/$tool.path"
            chmod +x "$(cat "/tmp/$tool.path")"
          done
      - name: Select and hydrate real previously UNREPRESENTED source shards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p plans
          for shard in 0 1; do
            python Scripts/acnh303_uncovered_model_bdli_wave.py select \
              --root . --shard "$shard" --shards 64 \
              --plan "plans/shard_$shard.json" \
              --sparse "plans/shard_$shard.sparse"
            git sparse-checkout add --stdin < "plans/shard_$shard.sparse"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          nca='e10617820db06889e1638499478da0de_NCA/1/'
          plans=[json.loads(Path(f'plans/shard_{s}.json').read_text()) for s in (0,1)]
          paths=[x['source_path'] for p in plans for x in p['sources']]
          assert len(paths)==len(set(paths))==64
          assert all((Path(nca)/p).is_file() for p in paths)
          assert all(p['per_category']=={'Model':8,'BDLI':24} for p in plans)
          assert all(p['native_runtime_evidence_captured'] is False for p in plans)
          print('Real source Git blobs hydrated:',len(paths),'(16 Model / 48 BDLI)')
          PY
      - name: Actually decode Model to GLB/PNG and rehash BDLI/LBLI bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wave_reports
          for shard in 0 1; do
            printf -v index "%03d" "$shard"
            python Scripts/acnh303_uncovered_model_bdli_wave.py run \
              --root . --plan "plans/shard_$shard.json" \
              --out "audit/unrepresented/shard_$index" \
              --report "wave_reports/source_wave_shard_${index}_run_${GITHUB_RUN_ID}.json" \
              --wmdlt "$(cat /tmp/wmdlt.path)" \
              --wimgt "$(cat /tmp/wimgt.path)"
          done
      - name: Re-verify report provenance and media/Native boundary
        shell: bash
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'Scripts')
          from acnh303_uncovered_wave_ledger import read_reports
          from acnh303_full_audit import inventory_from_git
          from acnh303_history_sha_merge import deduplicate
          from acnh303_priority_model_bdli import existing_paths
          root=Path('.')
          tree=inventory_from_git(root)
          attempts,meta=read_reports(root/'wave_reports',tree)
          assert len(attempts)==64
          assert sum(x['category']=='Model' for x in attempts)==16
          assert sum(x['category']=='BDLI' for x in attempts)==48
          assert meta['native_runtime_evidence_captured'] is False
          assert meta['original_source_bytes_rehashed_during_this_import'] is False
          assert meta['fresh_l3_media_files_claimed_from_real_CI'] >= 1, 'No actual new GLB/PNG was produced'
          assert meta['static_bdli_sources_verified_in_real_CI'] >= 1, 'No real BDLI structure was verified'
          known=existing_paths(root/'UnPack/_meta/history_sha_merge/source_ledger.jsonl.gz')
          new_paths={a['source_path'] for a in attempts}
          assert len(new_paths)==64 and not(new_paths & known), 'Not actually uncovered sources'
          source_records,stats=deduplicate(tree, attempts)
          assert len(source_records)==64 and stats['deduplicated_retry_rows']==0
          assert all(x['status'] in ('partial','raw_extracted','no_output','failed') for x in attempts)
          print('Genuine previously unrepresented source identities:',len(new_paths))
          print('New real L3 media files:',meta['fresh_l3_media_files_claimed_from_real_CI'])
          print('Verified original BDLI static sources:',meta['static_bdli_sources_verified_in_real_CI'])
          print('Game Native semantic consumer remains NOT_CAPTURED')
          PY
      - name: Save actual source SHA evidence and converted/failed artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acnh303-new-model-bdli-real-shards-${{ github.run_id }}
          path: |
            wave_reports/
            plans/*.json
            audit/unrepresented/
          retention-days: 30
          if-no-files-found: warn
      - name: Persist immutable verified wave reports only on default branch
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          destination=UnPack/_meta/history_sha_merge/_inputs/unrepresented_real_shards
          mkdir -p "$destination"
          cp wave_reports/source_wave_shard_*.json "$destination/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -- "$destination"
          test -n "$(git diff --cached --name-only)"
          git commit -m "data(acnh303): original-byte Model/BDLI shard proof with genuine L3 outputs"
          git fetch --no-tags origin 3.0.3_Unpack
          git rebase origin/3.0.3_Unpack
          git push origin HEAD:3.0.3_Unpack
      - name: Dispatch global dedup rebuild after exact new CI evidence is committed
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run acnh303-historical-sha-ledger.yml \
            --repo "$GITHUB_REPOSITORY" --ref 3.0.3_Unpack
          echo "Rebuild requested. No new source count is claimed until global SHA ledger succeeds."
