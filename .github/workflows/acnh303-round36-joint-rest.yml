name: ACNH R36 Original FSKL glTF Joint Rest and IBM Audit
on:
  push:
    branches: [feat/acnh303-round36-animation-audit]
    paths:
      - '.github/workflows/acnh303-round36-joint-rest.yml'
      - 'tools/r36-bind/**'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: acnh-r36-rest-pose
  cancel-in-progress: false
jobs:
  rest_joint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            derived
            tools/r36-bind
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download previously source-verified R35 real PlayerBody mesh+Skin GLB
        run: |
          set -euo pipefail
          mkdir -p r35-reference
          gh release download acnh303-r35-playerbody-skin-fska-animated-glb-20261015 \
            -R 969981/ACNH_Resources --dir r35-reference --pattern 'PlayerBody_3_FSKA_frame_sampled.glb'
          echo '4742148c5f4066b68f76b50028dca4ccca440672529e662ea7b7158f626ab597  r35-reference/PlayerBody_3_FSKA_frame_sampled.glb' | sha256sum -c -
      - name: Native FSKL to glTF exact Skin rest transform, parent and inverse bind audit
        run: |
          python tools/r36-bind/joint_rest_audit.py \
            --glb r35-reference/PlayerBody_3_FSKA_frame_sampled.glb \
            --skeleton derived/3.0.3/r35_fska_gltf/playerbody_skeleton.json \
            --match derived/3.0.3/r35_fska_gltf/player_bone_match.json \
            --sha 4742148c5f4066b68f76b50028dca4ccca440672529e662ea7b7158f626ab597 \
            --out derived/3.0.3/r36_joint_rest/real_joint_rest_IBM.json
          python - <<'PY'
          import json
          a=json.load(open('derived/3.0.3/r36_joint_rest/real_joint_rest_IBM.json'))
          assert a['actual_native_bones']==a['actual_glTF_skin_joints']==46
          assert a['actual_geometry_meshes']==11
          assert sum(a['joint_transform_classes'].values())==46
          assert len(a['joint_records'])==46
          print("R36 REST CLASSIFICATION",a['joint_transform_classes'])
          print("R36 REAL PARENT MATCH",a['joint_parent_name_matches'],a['joint_parent_name_mismatches'])
          print("R36 INVERSE BINDS", {k:v for k,v in a['inverse_bind_matrices'].items() if k!='members'})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r36-original-FSKL-glTF-joint-rest-IBM-audit
          path: derived/3.0.3/r36_joint_rest/real_joint_rest_IBM.json
      - name: Persist original FSKL/rest/IBM audit, never model binaries
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse derived/3.0.3/r36_joint_rest/real_joint_rest_IBM.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(r36): source-backed 46-joint FSKL to actual glTF rest/IBM provenance'
          for retry in 1 2 3 4 5 6; do
            git fetch origin feat/acnh303-round36-animation-audit
            git rebase FETCH_HEAD
            if git push origin HEAD:feat/acnh303-round36-animation-audit; then exit 0; fi
            sleep 1
          done
          exit 1
