name: ACNH 3.0.3 | R76 original 14-language MSBT semantic probe
on:
  push:
    branches: [3.0.3_Unpack]
    paths:
      - 'Scripts/acnh303_r76_msbt_probe.py'
      - '.github/workflows/acnh303-r76-msbt-full-probe.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: acnh303-r76-msbt-full
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/acnh_formats.py
            /Scripts/acnh303_r75_original_message_npc_audit.py
            /Scripts/acnh303_r76_msbt_probe.py
            /e10617820db06889e1638499478da0de_NCA/1/Message/String_*.sarc.zs
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install zstandard
      - name: Decode all genuine 14 x 133 MSBT structures and inspect selected labels
        run: python Scripts/acnh303_r76_msbt_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acnh-r76-original-msbt-label-probe
          path: assets/evidence/rom-database/r76-msbt-14-language-probe.json
          retention-days: 30
      - name: Commit evidence from original Nintendo 3.0.3 MSBT
        shell: bash
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -- assets/evidence/rom-database/r76-msbt-14-language-probe.json
          git commit -m 'evidence: decode all native 3.0.3 MSBT label tables in 14 locales'
          for i in 1 2 3 4; do
            git fetch --no-tags origin 3.0.3_Unpack
            git rebase origin/3.0.3_Unpack
            if git push origin HEAD:3.0.3_Unpack; then exit 0; fi
            sleep 5
          done
          exit 1
