name: ACNH 3.0.3 BFRES BNTX Pinned Converter Smoke
on:
  push:
    branches: [feat/acnh303-media-l3]
    paths: [".github/workflows/acnh303-media-l3-prebuilt.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  glb-and-png:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          lfs: false
          sparse-checkout: |
            /scripts/
            /e10617820db06889e1638499478da0de_NCA/1/Model/AccessoryGlassBirthday0.Nin_NX_NVN.zs
            /e10617820db06889e1638499478da0de_NCA/1/Layout/Bell.Nin_NX_NVN.zs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r scripts/requirements.txt
      - name: Fetch and verify pinned third-party native converters
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/quatric/nintoolbox/releases/download/nightly-20261013
          curl -fLsS --retry 3 "$base/nintoolbox-linux-x86_64.tar.gz" -o /tmp/nintoolbox.tar.gz
          curl -fLsS --retry 3 "$base/SHA256SUMS.txt" -o /tmp/SHA256SUMS.txt
          cd /tmp
          grep 'nintoolbox-linux-x86_64.tar.gz$' SHA256SUMS.txt | sha256sum -c -
          mkdir -p /tmp/nintoolbox-extracted
          tar -tzf /tmp/nintoolbox.tar.gz | head -60 || true
          tar -xzf /tmp/nintoolbox.tar.gz -C /tmp/nintoolbox-extracted
          find /tmp/nintoolbox-extracted -type f \( -name wmdlt -o -name wimgt \) -print
          wmdlt=$(find /tmp/nintoolbox-extracted -type f -name wmdlt | head -n 1)
          wimgt=$(find /tmp/nintoolbox-extracted -type f -name wimgt | head -n 1)
          test -n "$wmdlt" && test -n "$wimgt"
          chmod +x "$wmdlt" "$wimgt"
          echo "$wmdlt" >/tmp/wmdlt.path
          echo "$wimgt" >/tmp/wimgt.path
          "$wmdlt" version || true
          "$wimgt" version || true
      - name: Convert genuine ACNH BFRES asset to validated geometry GLB
        run: |
          python scripts/acnh303_media_l3.py --root . \
            --source Model/AccessoryGlassBirthday0.Nin_NX_NVN.zs \
            --tool-wmdlt "$(cat /tmp/wmdlt.path)" \
            --tool-wimgt "$(cat /tmp/wimgt.path)" \
            --out Unpack_L3 --require bfres --fail-on-no-conversion
      - name: Convert embedded BNTX from real Layout source, if it is present
        run: |
          python scripts/acnh303_media_l3.py --root . \
            --source Layout/Bell.Nin_NX_NVN.zs \
            --tool-wmdlt "$(cat /tmp/wmdlt.path)" \
            --tool-wimgt "$(cat /tmp/wimgt.path)" \
            --out Unpack_L3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acnh303-real-glb-png-prebuilt-smoke
          path: Unpack_L3/
          if-no-files-found: warn
          retention-days: 14
