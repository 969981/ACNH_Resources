name: ACNH 3.0.3 R117 savefile crypto
on:
  pull_request:
    paths:
      - 'Scripts/acnh303_r117*'
      - 'derived/3.0.3/npc_event_flags/r117_savefile_crypto/**'
      - '.github/workflows/acnh303-r117-savefile.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify-r117:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/acnh303_r117_savefile_crypto.py
            /Scripts/acnh303_r100_nso_decode.py
            /Scripts/acnh303_r99_relocation.py
            /Scripts/acnh303_r96_native_tables.py
            /Scripts/acnh303_r95_native_eventflags.py
            /Scripts/acnh303_round11_elf_xref.py
            /derived/3.0.3/npc_event_flags/r117_savefile_crypto/
            /derived/3.0.3/ghidra12.2/c/32/02703290.c
            /derived/3.0.3/ghidra12.2/c/f2/026ef2cc.c
            /derived/3.0.3/ghidra12.2/c/94/026f9460.c
            /derived/3.0.3/ghidra12.2/c/b8/026eb860.c
            /derived/3.0.3/ghidra12.2/c/b9/026eb980.c
            /derived/3.0.3/ghidra12.2/c/b5/026eb5c0.c
            /derived/3.0.3/ghidra12.2/c/f7/026cf750.c
            /derived/3.0.3/ghidra12.2/c/e9/026ce9d0.c
            /derived/3.0.3/ghidra12.2/c/b2/028cb2a0.c
            /derived/3.0.3/ghidra12.2/c/29/028c29b0.c
            /derived/3.0.3/ghidra12.2/c/2d/00d72dc0.c
            /derived/3.0.3/ghidra12.2/c/79/02837970.c
            /derived/3.0.3/ghidra12.2/c/84/02838430.c
            /derived/3.0.3/ghidra12.2/c/8e/02838e10.c
            /derived/3.0.3/ghidra12.2/c/99/02839940.c
            /derived/3.0.3/ghidra12.2/c/a1/0283a1b0.c
            /derived/3.0.3/ghidra12.2/c/b3/0283b370.c
            /derived/3.0.3/ghidra12.2/c/aa/0283aa30.c
            /e10617820db06889e1638499478da0de_NCA/0/main
            /e10617820db06889e1638499478da0de_NCA/0/main.elf
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install capstone==5.0.6 lz4==4.4.4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/969981/ACNH_Resources/actions/artifacts/14891728627/zip > r116.zip
      - run: python Scripts/acnh303_r117_savefile_crypto.py --root . --prior r116.zip --out artifacts/r117
      - uses: actions/upload-artifact@v4
        with:
          name: acnh303-r117-savefile-crypto
          path: artifacts/r117/
          if-no-files-found: error
