name: ACNH 3.0.3 R113 SaveProc
on:
  pull_request:
    paths:
      - 'Scripts/acnh303_r113*'
      - 'derived/3.0.3/npc_event_flags/r113_saveproc/**'
      - '.github/workflows/acnh303-r113-saveproc.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify-r113:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/acnh303_r113_saveproc.py
            /Scripts/acnh303_r100_nso_decode.py
            /Scripts/acnh303_r99_relocation.py
            /Scripts/acnh303_r96_native_tables.py
            /Scripts/acnh303_r95_native_eventflags.py
            /Scripts/acnh303_round11_elf_xref.py
            /derived/3.0.3/npc_event_flags/r113_saveproc/
            /derived/3.0.3/ghidra12.2/c/e2/0283e2d0.c
            /derived/3.0.3/ghidra12.2/c/c2/0283c2a8.c
            /derived/3.0.3/ghidra12.2/c/c5/0283c5d0.c
            /derived/3.0.3/ghidra12.2/c/c6/0283c6a8.c
            /derived/3.0.3/ghidra12.2/c/cb/0283cb14.c
            /derived/3.0.3/ghidra12.2/c/cb/0283cb2c.c
            /derived/3.0.3/ghidra12.2/c/d4/0283d4c4.c
            /derived/3.0.3/ghidra12.2/c/d4/0283d404.c
            /derived/3.0.3/ghidra12.2/c/e5/0283e518.c
            /derived/3.0.3/ghidra12.2/c/b1/03ebb160.c
            /derived/3.0.3/ghidra12.2/c/2f/00822f90.c
            /derived/3.0.3/ghidra12.2/c/49/01384940.c
            /derived/3.0.3/ghidra12.2/c/df/028bdff0.c
            /derived/3.0.3/ghidra12.2/c/fa/01d4fa90.c
            /derived/3.0.3/ghidra12.2/c/a6/01dba640.c
            /e10617820db06889e1638499478da0de_NCA/0/main
            /e10617820db06889e1638499478da0de_NCA/0/main.elf
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install capstone==5.0.6 lz4==4.4.4
      - name: Fetch authenticated R112 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/969981/ACNH_Resources/actions/artifacts/14891550048/zip > r112.zip
      - run: python Scripts/acnh303_r113_saveproc.py --root . --prior r112.zip --out artifacts/r113
      - uses: actions/upload-artifact@v4
        with:
          name: acnh303-r113-saveproc
          path: artifacts/r113/
          if-no-files-found: error
