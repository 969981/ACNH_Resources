name: ACNH 3.0.3 R128 savefile index
on:
  pull_request:
    paths:
      - 'Scripts/acnh303_r128*'
      - 'derived/3.0.3/npc_event_flags/r128_savefile_index/**'
      - '.github/workflows/acnh303-r128-savefile-index.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify-r128:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/acnh303_r128_savefile_index.py
            /Scripts/acnh303_r124_interface_registry.py
            /Scripts/acnh303_r123_cloud_interface.py
            /Scripts/acnh303_r122_backend_abi.py
            /Scripts/acnh303_r120_native_save.py
            /Scripts/acnh303_r119_save_dispatch.py
            /Scripts/acnh303_r100_nso_decode.py
            /Scripts/acnh303_r99_relocation.py
            /Scripts/acnh303_r96_native_tables.py
            /Scripts/acnh303_r95_native_eventflags.py
            /Scripts/acnh303_round11_elf_xref.py
            /derived/3.0.3/npc_event_flags/r128_savefile_index/
            /derived/3.0.3/ghidra12.2/c/d2/026ed290.c
            /derived/3.0.3/ghidra12.2/c/12/02701270.c
            /derived/3.0.3/ghidra12.2/c/14/027014c0.c
            /derived/3.0.3/ghidra12.2/c/18/02701810.c
            /derived/3.0.3/ghidra12.2/c/29/028c29b0.c
            /derived/3.0.3/ghidra12.2/c/b2/028cb2a0.c
            /e10617820db06889e1638499478da0de_NCA/0/main
            /e10617820db06889e1638499478da0de_NCA/0/main.elf
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install capstone==5.0.6 lz4==4.4.4 unicorn==2.1.4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/969981/ACNH_Resources/actions/artifacts/14897256721/zip > r127.zip
      - run: python Scripts/acnh303_r128_savefile_index.py --r127 r127.zip --out artifacts/r128
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acnh303-r128-savefile-index
          path: artifacts/r128/
          if-no-files-found: warn
