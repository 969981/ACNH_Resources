name: ACNH 3.0.3 | Verify independent PNG icon sources
on:
  workflow_dispatch:
  push:
    branches: [3.0.3_Unpack]
    paths:
      - 'Scripts/acnh303_icon_source_probe.py'
      - '.github/workflows/acnh303-icon-source-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /Scripts/
            /assets/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Check live remote PNG bytes, hash and decode
        run: python Scripts/acnh303_icon_source_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acnh303-remote-png-probe-${{ github.run_id }}
          path: assets/evidence/icon-cdn-smoke.json
          if-no-files-found: warn
