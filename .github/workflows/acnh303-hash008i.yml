name: ACNH303 HASH-008I native mail category dictionary
on:
  push:
    branches: [research]
    paths:
      - 'Scripts/acnh303_hash008i.py'
      - '.github/workflows/acnh303-hash008i.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/acnh303_hash008e.py
            /Scripts/acnh303_hash008i.py
            /e10617820db06889e1638499478da0de_NCA/0/main
            /e10617820db06889e1638499478da0de_NCA/0/main.elf
            /e10617820db06889e1638499478da0de_NCA/1/Bcsv/ItemParam.bcsv
            /e10617820db06889e1638499478da0de_NCA/1/Bcsv/ItemMailAttachCategoryGroup.bcsv
      - run: python -m pip install capstone==5.0.3 lz4==4.3.3
      - run: python Scripts/acnh303_hash008i.py --out artifacts/hash008i
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ACNH303-HASH008I
          path: artifacts/hash008i/
          if-no-files-found: warn
