name: ACNH 3.0.3 R115 Save types and cloud state
on:
  pull_request:
    paths:
      - 'Scripts/acnh303_r115*'
      - 'derived/3.0.3/npc_event_flags/r115_save_types/**'
      - '.github/workflows/acnh303-r115-save-types.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify-r115:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/acnh303_r115_save_types.py
            /Scripts/acnh303_r100_nso_decode.py
            /Scripts/acnh303_r99_relocation.py
            /Scripts/acnh303_r96_native_tables.py
            /Scripts/acnh303_r95_native_eventflags.py
            /Scripts/acnh303_round11_elf_xref.py
            /derived/3.0.3/npc_event_flags/r115_save_types/
            /derived/3.0.3/ghidra12.2/c/d2/026ed290.c
            /derived/3.0.3/ghidra12.2/c/12/02701270.c
            /derived/3.0.3/ghidra12.2/c/14/027014c0.c
            /derived/3.0.3/ghidra12.2/c/67/028367f0.c
            /derived/3.0.3/ghidra12.2/c/6b/02836b14.c
            /derived/3.0.3/ghidra12.2/c/bf/0283bffc.c
            /derived/3.0.3/ghidra12.2/c/3a/026f3ad0.c
            /derived/3.0.3/ghidra12.2/c/3d/026f3de0.c
            /derived/3.0.3/ghidra12.2/c/27/026f27c0.c
            /derived/3.0.3/ghidra12.2/c/f2/028bf25c.c
            /derived/3.0.3/ghidra12.2/c/16/026d16c0.c
            /derived/3.0.3/ghidra12.2/c/17/026d17d8.c
            /derived/3.0.3/ghidra12.2/c/18/026d189c.c
            /derived/3.0.3/ghidra12.2/c/38/02833830.c
            /derived/3.0.3/ghidra12.2/c/c6/0283c6a8.c
            /derived/3.0.3/ghidra12.2/c/cf/01c7cf1c.c
            /e10617820db06889e1638499478da0de_NCA/0/main
            /e10617820db06889e1638499478da0de_NCA/0/main.elf
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install capstone==5.0.6 lz4==4.4.4
      - name: Fetch authenticated R114 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/969981/ACNH_Resources/actions/artifacts/14892055136/zip > r114.zip
      - run: python Scripts/acnh303_r115_save_types.py --root . --prior r114.zip --out artifacts/r115
      - uses: actions/upload-artifact@v4
        with:
          name: acnh303-r115-save-types
          path: artifacts/r115/
          if-no-files-found: error
