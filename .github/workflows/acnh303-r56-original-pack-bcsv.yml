name: ACNH 3.0.3 | R56 audit 39 names in StaticParam and all BCSV tables
on:
  push:
    branches: [3.0.3_Unpack]
    paths:
      - 'Scripts/acnh303_r56_bcsv_staticparam_39.py'
      - '.github/workflows/acnh303-r56-original-pack-bcsv.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: acnh303-r56-original-pack
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/
            /assets/evidence/rom-items/
            /UnPack/1/Bcsv/
            /e10617820db06889e1638499478da0de_NCA/1/Pack/StaticParam.pack
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded zstd parser
        run: python -m pip install zstandard
      - name: Scan all 234 original BCSV and exact original StaticParam SARC
        run: python Scripts/acnh303_r56_bcsv_staticparam_39.py
      - name: Commit evidence only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- assets/evidence/rom-items/r56-bcsv-staticparam-original-39.json assets/evidence/rom-items/r56-bcsv-staticparam-original-39.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'evidence: scan real StaticParam pack and 234 BCSV tables for 39 names'
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin 3.0.3_Unpack
            if ! git rebase origin/3.0.3_Unpack; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:3.0.3_Unpack; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
