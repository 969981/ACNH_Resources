name: ACNH R35 Source Native Player FSKA Hermite Animation Curves
on:
  push:
    branches: [feat/acnh303-round35-fska-gltf-short-bwav-bnsh186]
    paths:
      - '.github/workflows/acnh303-round35-hermite.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            derived
            tools/r35-animation-hermite
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install -r scripts/requirements-media.txt
      - name: Use exactly the SHA-verified 2.4 MB original FSKA source
        run: |
          p='e10617820db06889e1638499478da0de_NCA/1/Model/CharactorAnimation20000.Nin_NX_NVN.zs'
          git checkout --ignore-skip-worktree-bits HEAD -- "$p"
          test -f "$p"
          python scripts/acnh303_round34_fska_source.py --outdir derived/3.0.3/r35_hermite_input
      - name: Recover actual native Value/In/Out Hermite keyframes from BfresLibrary
        run: |
          dotnet restore tools/r35-animation-hermite/HermiteProbe.csproj
          dotnet run --project tools/r35-animation-hermite/HermiteProbe.csproj --configuration Release --no-restore -- \
            derived/3.0.3/r35_hermite_input/original_exact_output.bfres \
            derived/3.0.3/r35_fska_gltf/player_hermite_curves.json
          python - <<'PY'
          import json
          r=json.load(open('derived/3.0.3/r35_fska_gltf/player_hermite_curves.json'))
          assert len(r['animations'])==3
          for a in r['animations']:
            assert len(a['BoneAnims'])>0 and a['FrameCount']>0
            print('R35 HERMITE ACTUAL',a['Name'],a['FlagsRotate'],a['FrameCount'],len(a['BoneAnims']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r35-three-original-player-skeletal-cubic-Hermite-animations
          path: derived/3.0.3/r35_fska_gltf/player_hermite_curves.json
      - name: Persist tested Hermite scalar curve metadata
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse derived/3.0.3/r35_fska_gltf/player_hermite_curves.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(r35): actual source Hermite Curve Value/In/Out for three Player FSKA animations'
          for i in 1 2 3 4 5 6; do
            git fetch origin feat/acnh303-round35-fska-gltf-short-bwav-bnsh186
            git rebase FETCH_HEAD
            if git push origin HEAD:feat/acnh303-round35-fska-gltf-short-bwav-bnsh186; then exit 0; fi
            sleep 1
          done
          exit 1
