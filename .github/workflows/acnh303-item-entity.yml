name: ACNH ItemEntityCodec audit
on:
  workflow_dispatch:
  push:
    branches: [research]
    paths: ['Scripts/item_entity/**','.github/workflows/acnh303-item-entity.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Scripts/item_entity
            Scripts/bcsv
            research/catalog/variants
            e10617820db06889e1638499478da0de_NCA/1/Bcsv
      - uses: actions/checkout@v4
        with:
          repository: 969981/ACNHPokerCore
          ref: 85e50a1ad182c926b2ebd51c00abc612e0a859d5
          path: poker
          sparse-checkout: |
            ACNHPokerCore/Inventory
            ACNHPokerCore/Utilities
      - uses: astral-sh/setup-uv@v6
      - run: uv run --no-project --python 3.12 python -m unittest discover -s Scripts/item_entity -p test_codec.py -v
      - run: uv run --no-project --python 3.12 python Scripts/item_entity/build_policy.py --poker poker
      - uses: actions/upload-artifact@v4
        with:
          name: acnh303-item-entity
          path: out/item-entity
  publish:
    needs: audit
    if: github.ref == 'refs/heads/research'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research
          sparse-checkout: research/catalog/item-entity
      - uses: actions/download-artifact@v4
        with:
          name: acnh303-item-entity
          path: /tmp/item-entity
      - run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags --depth=1 origin research
            for p in Scripts/item_entity Scripts/bcsv/bcsv.py research/catalog/variants/storage/item_route.csv research/catalog/variants/encoding/mode_policy.csv research/catalog/variants/variant_combination.csv e10617820db06889e1638499478da0de_NCA; do
              test "$(git rev-parse "$GITHUB_SHA:$p")" = "$(git rev-parse "FETCH_HEAD:$p")"
            done
            test "$(git rev-parse --verify -q "$GITHUB_SHA:research/catalog/item-entity" || true)" = "$(git rev-parse --verify -q "FETCH_HEAD:research/catalog/item-entity" || true)"
            git checkout --detach FETCH_HEAD
            mkdir -p research/catalog/item-entity
            cp /tmp/item-entity/* research/catalog/item-entity/
            git add research/catalog/item-entity
            if git diff --cached --quiet; then exit 0; fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data(entity): archive per-item codec compatibility policies"
            if git push origin HEAD:research; then exit 0; fi
          done
          exit 1
