name: ACNH 3.0.3 R131 cloud process
on:
  pull_request:
    paths:
      - 'Scripts/acnh303_r131*'
      - 'derived/3.0.3/npc_event_flags/r131_cloud_process/**'
      - '.github/workflows/acnh303-r131-cloud-process.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify-r131:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/acnh303_r131_cloud_process.py
            /Scripts/acnh303_r124_interface_registry.py
            /Scripts/acnh303_r123_cloud_interface.py
            /Scripts/acnh303_r122_backend_abi.py
            /Scripts/acnh303_r120_native_save.py
            /Scripts/acnh303_r119_save_dispatch.py
            /Scripts/acnh303_r100_nso_decode.py
            /Scripts/acnh303_r99_relocation.py
            /Scripts/acnh303_r96_native_tables.py
            /Scripts/acnh303_r95_native_eventflags.py
            /Scripts/acnh303_round11_elf_xref.py
            /derived/3.0.3/npc_event_flags/r131_cloud_process/
            /derived/3.0.3/ghidra12.2/c/c6/0283c6a8.c
            /derived/3.0.3/ghidra12.2/c/c5/0283c5d0.c
            /derived/3.0.3/ghidra12.2/c/cb/0283cba8.c
            /derived/3.0.3/ghidra12.2/c/0e/02700ee8.c
            /derived/3.0.3/ghidra12.2/c/57/026f5738.c
            /derived/3.0.3/ghidra12.2/c/58/026f5820.c
            /derived/3.0.3/ghidra12.2/c/c4/0283c42c.c
            /derived/3.0.3/ghidra12.2/c/d4/0283d404.c
            /derived/3.0.3/ghidra12.2/c/e2/0283e2d0.c
            /derived/3.0.3/ghidra12.2/c/e5/0283e518.c
            /e10617820db06889e1638499478da0de_NCA/0/main
            /e10617820db06889e1638499478da0de_NCA/0/main.elf
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install capstone==5.0.6 lz4==4.4.4 unicorn==2.1.4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/969981/ACNH_Resources/actions/artifacts/14899040236/zip > r130.zip
      - run: python Scripts/acnh303_r131_cloud_process.py --r130 r130.zip --out artifacts/r131
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acnh303-r131-cloud-process
          path: artifacts/r131/
          if-no-files-found: warn
