name: ACNH 3.0.3 | R84 107 native item fields and source audit
on:
  push:
    branches: [3.0.3_Unpack]
    paths:
      - 'Scripts/acnh303_r84_native_item_database.py'
      - '.github/workflows/acnh303-r84-native-item-database.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  native-item-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/acnh303_r84_native_item_database.py
            /UnPack/1/Bcsv/ItemParam.csv
            /UnPack/1/Bcsv/ItemParam.json
            /UnPack/1/Bcsv/ItemRemake.csv
            /e10617820db06889e1638499478da0de_NCA/1/Bcsv/ItemParam.bcsv
            /e10617820db06889e1638499478da0de_NCA/1/Bcsv/ItemRemake.bcsv
            /e10617820db06889e1638499478da0de_NCA/1/Bcsv/ItemKind.bcsv
            /UnPack/1/Bcsv/ItemKind.csv
            /assets/evidence/rom-database/r82-acnh303-villager-provenance.sqlite3.zst
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install zstandard
      - name: Validate script syntax
        run: python -m py_compile Scripts/acnh303_r84_native_item_database.py
      - name: Restore and check 11178 x 107 native fields
        run: python Scripts/acnh303_r84_native_item_database.py
      - name: Publish JSON evidence and SQLite/CSV data without asserting native runtime behavior
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ACNH303_R84_ItemParam107_SourceRemake_Images_SQLite
          path: |
            assets/evidence/rom-database/r84/**
            e10617820db06889e1638499478da0de_NCA/1/Bcsv/ItemParam.bcsv
            e10617820db06889e1638499478da0de_NCA/1/Bcsv/ItemRemake.bcsv
            e10617820db06889e1638499478da0de_NCA/1/Bcsv/ItemKind.bcsv
            UnPack/1/Bcsv/ItemParam.csv
            UnPack/1/Bcsv/ItemParam.json
            UnPack/1/Bcsv/ItemRemake.csv
            UnPack/1/Bcsv/ItemKind.csv
          if-no-files-found: warn
          retention-days: 90

      - name: Commit verified R84 source indexes (keep full database in Actions artifact)
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -- \
            assets/evidence/rom-database/r84/r84-evidence-summary.json \
            assets/evidence/rom-database/r84/r84-field-hash-dictionary.csv \
            assets/evidence/rom-database/r84/r84-itemparam-original-107-fields.csv \
            assets/evidence/rom-database/r84/r84-itemremake-ID-mapping.csv \
            assets/evidence/rom-database/r84/r84-original-model-icon-source-audit.csv
          if git diff --cached --quiet; then
            echo 'R84 source indexes unchanged'
            exit 0
          fi
          git commit -m 'data(R84): 11178 raw ItemParam rows, 107 fields, source paths and remake joins'
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin 3.0.3_Unpack
            if ! git rebase origin/3.0.3_Unpack; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:3.0.3_Unpack; then
              exit 0
            fi
            sleep $((attempt*3))
          done
          exit 1
