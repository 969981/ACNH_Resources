name: ACNH 3.0.3 R107 gift filter and enum evidence
on:
  pull_request:
    paths:
      - 'Scripts/acnh303_r107_gift_native.py'
      - 'derived/3.0.3/npc_event_flags/r107/**'
      - '.github/workflows/acnh303-r107-gift-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/
            /derived/3.0.3/ghidra12.2/c/
            /e10617820db06889e1638499478da0de_NCA/0/main
            /e10617820db06889e1638499478da0de_NCA/0/main.elf
            /e10617820db06889e1638499478da0de_NCA/1/Bcsv/
            /UnPack/1/Bcsv/
            /UnPack/1/EventFlow/NNPC_Select_Present.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lz4==4.4.4 capstone==5.0.6
      - run: python Scripts/acnh303_r107_gift_native.py --root . --out artifacts/acnh303-r107
      - uses: actions/upload-artifact@v4
        with:
          name: acnh303-r107-gift-native
          path: artifacts/acnh303-r107/
          if-no-files-found: error
          retention-days: 90
