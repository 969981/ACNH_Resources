name: ACNH 3.0.3 R103 gift modes and villager invite profiles
on:
  pull_request:
    paths:
      - 'Scripts/acnh303_r103*'
      - 'derived/3.0.3/npc_event_flags/r103/**'
      - '.github/workflows/acnh303-r103-gift-modes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/acnh303_r95_native_eventflags.py
            /Scripts/acnh303_r96_native_tables.py
            /Scripts/acnh303_r99_relocation.py
            /Scripts/acnh303_r100_nso_decode.py
            /Scripts/acnh303_r101_factory_records.py
            /Scripts/acnh303_r102_reward_query.py
            /Scripts/acnh303_r103_gift_modes.py
            /Scripts/acnh303_round11_elf_xref.py
            /derived/3.0.3/ghidra12.2/c/
            /e10617820db06889e1638499478da0de_NCA/0/main
            /e10617820db06889e1638499478da0de_NCA/0/main.elf
            /e10617820db06889e1638499478da0de_NCA/1/Bcsv/NmlNpcParam.bcsv
            /UnPack/1/Bcsv/NmlNpcParam.csv
            /UnPack/1/EventFlow/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lz4==4.4.4 capstone==5.0.6
      - name: Verify gift routes, reward predicates and 417 profiles
        run: python Scripts/acnh303_r103_gift_modes.py --root . --out artifacts/acnh303-r103
      - uses: actions/upload-artifact@v4
        with:
          name: acnh303-r103-gift-modes
          path: artifacts/acnh303-r103/
          if-no-files-found: error
          retention-days: 90
