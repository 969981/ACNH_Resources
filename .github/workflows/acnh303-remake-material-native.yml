name: ACNH 3.0.3 remake material native
on:
  pull_request:
    branches: [3.0.3_Unpack]
    paths:
      - 'Scripts/acnh303_remake_material_native.py'
      - '.github/workflows/acnh303-remake-material-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/acnh303_remake_material_native.py
            /Scripts/acnh303_r100_nso_decode.py
            /Scripts/acnh303_r99_relocation.py
            /Scripts/acnh303_r96_native_tables.py
            /Scripts/acnh303_r95_native_eventflags.py
            /Scripts/acnh303_round11_elf_xref.py
            /e10617820db06889e1638499478da0de_NCA/0/main
            /e10617820db06889e1638499478da0de_NCA/0/main.elf
            /derived/3.0.3/ghidra12.2/c/0c/01530c60.c
            /derived/3.0.3/ghidra12.2/c/4b/01664b40.c
            /derived/3.0.3/ghidra12.2/c/e5/038fe510.c
            /derived/3.0.3/ghidra12.2/c/33/01533310.c
            /assets/evidence/babybed_bntx_native.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lz4==4.4.4 capstone==5.0.6
      - run: python Scripts/acnh303_remake_material_native.py --root . --out artifacts/remake-material-native
      - uses: actions/upload-artifact@v4
        with:
          name: remake-material-native
          path: artifacts/remake-material-native/
          if-no-files-found: error
