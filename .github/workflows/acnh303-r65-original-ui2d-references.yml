name: ACNH 3.0.3 | R65 parse all 960 UI2D Layout texture consumers
on:
  push:
    branches: [3.0.3_Unpack]
    paths:
      - 'Scripts/acnh303_r65_ui2d_texture_consumers.py'
      - '.github/workflows/acnh303-r65-original-ui2d-references.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: acnh303-r65-original-ui2d-layouts
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/
            /assets/evidence/rom-items/r61-all-1254-original-native-sources.json
            /assets/evidence/rom-ui-semantics/
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real zstd UI container decoder
        run: python -m pip install zstandard
      - name: Plan exact original UI source list without hydrating all game data
        shell: bash
        run: |
          set -euo pipefail
          python Scripts/acnh303_r65_ui2d_texture_consumers.py plan
          git sparse-checkout add --stdin < /tmp/acnh-r65-sparse-layouts.txt
      - name: Parse 960 real original UI archives and FLYT texture-name tables
        run: python Scripts/acnh303_r65_ui2d_texture_consumers.py verify
      - name: Preserve source-backed UI refs without claiming live runtime rendering
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -A -- assets/evidence/rom-ui-semantics/r65-native-ui2d-texture-consumers.json assets/evidence/rom-ui-semantics/r65-native-ui2d-texture-consumers.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'evidence: audit 960 original UI archives for precise FLYT/FLAN icon consumers'
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin 3.0.3_Unpack
            if ! git rebase origin/3.0.3_Unpack; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:3.0.3_Unpack; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
