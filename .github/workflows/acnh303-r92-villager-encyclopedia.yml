name: ACNH 3.0.3 R92 villager encyclopedia, recruitment and save evidence

on:
  pull_request:
    paths:
      - 'Scripts/acnh303_r91_nmlnpc_semantics.py'
      - 'Scripts/acnh303_r92_villager_encyclopedia.py'
      - '.github/workflows/acnh303-r92-villager-encyclopedia.yml'
      - 'docs/25-R92-Villager-Encyclopedia-Recruitment-Save-Evidence.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-r92-full-villager-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/
            /assets/evidence/rom-database/r82-acnh303-villager-provenance.sqlite3.zst
            /assets/evidence/rom-database/r82-npc-original-provenance-report.json
            /UnPack/1/Bcsv/NmlNpcParam.csv
            /UnPack/1/Bcsv/NmlNpcParam.json
            /UnPack/1/Bcsv/NpcLooksParam.csv
            /UnPack/1/Bcsv/NmlNpcRaceParam.csv
            /UnPack/1/Bcsv/ItemParam.csv
            /UnPack/1/Bcsv/ItemParam.json
            /UnPack/1/Bcsv/ItemRemake.csv
            /UnPack/1/Bcsv/RecipeCraftParam.csv
            /UnPack/1/Bcsv/EventFlagsNpcMemoryParam.csv
            /UnPack/1/Bcsv/EventFlagsNpcSaveParam.csv
            /UnPack/1/Bcsv/EventFlagsNpcTempParam.csv
            /UnPack/1/Bcsv/EventFlagsPlayerActivityParam.csv
            /UnPack/1/EventFlow/NNPC_Reaction_Moving.json
            /UnPack/1/EventFlow/NNPC_Spot_Camp_Invite.json
            /UnPack/1/EventFlow/Obj_RcoMachine_AmiiboCall.json
            /UnPack/1/EventFlow/System_WherearenNPCMoveMode_Amiibo.json
            /UnPack/1/EventFlow/NNPC_Talk_Situation.json
            /e10617820db06889e1638499478da0de_NCA/1/Bcsv/ItemParam.bcsv
            /e10617820db06889e1638499478da0de_NCA/1/Bcsv/NmlNpcParam.bcsv
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native original SQLite decoder
        run: python -m pip install zstandard
      - name: Check Python syntax and existing v2 export unit tests
        run: |
          python -m compileall -q Scripts/acnh303_r91_nmlnpc_semantics.py Scripts/acnh303_r92_villager_encyclopedia.py
          python -m unittest discover -s Scripts -p 'test_acnh303_web14_export.py' -v
      - name: Create already verified R82/R84 original 14-locale V2
        run: python Scripts/acnh303_web14_export.py --root . --out artifacts/acnh303-web14
      - name: Rebuild R91 417 original-byte-verified Looks and Race
        run: python Scripts/acnh303_r91_nmlnpc_semantics.py --root . --out artifacts/acnh303-r91
      - name: Create R92 encyclopedia and invitation/save evidence
        run: python Scripts/acnh303_r92_villager_encyclopedia.py --root . --web14 artifacts/acnh303-web14 --r91 artifacts/acnh303-r91 --out artifacts/acnh303-r92
      - name: Independent R92 source and status gate
        shell: bash
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('artifacts/acnh303-r92')
          m=json.loads((root/'villager_research_manifest.json').read_text('utf-8'))
          persons=json.loads((root/'villager_encyclopedia_417.json').read_text('utf-8'))
          graph=json.loads((root/'villager_recruitment_eventflow_evidence.json').read_text('utf-8'))
          state=json.loads((root/'villager_save_state_definitions.json').read_text('utf-8'))
          assert len(persons)==417 and len({x['res_name'] for x in persons})==417
          assert all(len(x['names_14_locale'])==14 for x in persons)
          assert all(x['recruitment_capabilities']['can_be_adopted_from_other_island'] is None for x in persons)
          assert all(x['island_specific_state']['friendship'] is None for x in persons)
          assert m['stats']['collaboration_count']=={'0':407,'1':6,'2':2,'3':2} or m['stats']['collaboration_count']=={0:407,1:6,2:2,3:2}
          assert m['stats']['race_codes']==35 and m['stats']['look_types']==8
          assert len(m['stats']['hobby_candidates'])==6 and sum(m['stats']['hobby_candidates'].values())==417
          assert set(graph['collabo_query_event_indices'])=={111,112,113}
          assert graph['invite_check_type_values']==[0,1,2]
          assert not graph['all_native_query_implementations_verified']
          assert not state['actual_island_save_provided'] and state['actual_island_friendship_or_moving_values'] is None
          assert not m['native_function_boundaries_verified']
          for file,e in m['artifacts'].items():
              assert hashlib.sha256((root/file).read_bytes()).hexdigest()==e['sha256']
          print('R92 OK: 417 full original residents, 14 locales, six hobbies, 10 collab group, eventflow and save definitions, runtime gates.')
          PY
      - name: Upload full static evidence without pretending runtime state
        uses: actions/upload-artifact@v4
        with:
          name: acnh303-r92-villager-encyclopedia-save-recruitment
          path: artifacts/acnh303-r92/
          if-no-files-found: error
          retention-days: 30
