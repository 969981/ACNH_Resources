name: ACNH 3.0.3 remake model binding
on:
  pull_request:
    branches: [3.0.3_Unpack]
    paths:
      - 'Scripts/acnh303_remake_model_binding.py'
      - 'Scripts/test_acnh303_remake_model_binding.py'
      - '.github/workflows/acnh303-remake-model-binding.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/acnh303_remake_model_binding.py
            /Scripts/test_acnh303_remake_model_binding.py
            /Scripts/acnh303_r105_gift_db.py
            /UnPack/1/Bcsv/ItemParam.json
            /UnPack/1/Bcsv/ItemRemake.json
            /e10617820db06889e1638499478da0de_NCA/1/Bcsv/ItemParam.bcsv
            /e10617820db06889e1638499478da0de_NCA/1/Bcsv/ItemRemake.bcsv
            /derived/3.0.3/ghidra12.2/c/e3/01afe3e0.c
            /derived/3.0.3/ghidra12.2/c/ee/01afeef4.c
            /derived/3.0.3/ghidra12.2/c/3a/01ae3a80.c
            /derived/3.0.3/ghidra12.2/c/f9/01adf970.c
            /derived/3.0.3/ghidra12.2/c/db/0152dba0.c
            /derived/3.0.3/ghidra12.2/c/0c/01530c60.c
            /derived/3.0.3/ghidra12.2/c/4b/01664b40.c
            /derived/3.0.3/ghidra12.2/c/f0/01aff000.c
            /derived/3.0.3/ghidra12.2/c/72/01ad7260.c
            /derived/3.0.3/ghidra12.2/c/cf/01afcfa0.c
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s Scripts -p test_acnh303_remake_model_binding.py -v
      - run: python Scripts/acnh303_remake_model_binding.py --root . --out artifacts/remake-model-binding
      - uses: actions/upload-artifact@v4
        with:
          name: acnh303-remake-model-binding
          path: artifacts/remake-model-binding/
          if-no-files-found: error
