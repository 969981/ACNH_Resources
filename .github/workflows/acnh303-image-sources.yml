name: ACNH image source inventory
on:
  workflow_dispatch:
  push:
    branches: [research]
    paths:
      - 'Scripts/image_sources.py'
      - '.github/workflows/acnh303-image-sources.yml'
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Scripts
            docs/Sources/Images
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          ref: f09e15460d02790060a374b2ad6ba569ba9b97ed
          path: historical
          sparse-checkout: Scripts
      - run: python -m pip install zstandard==0.23.0
      - run: python Scripts/image_sources.py --historical historical
      - uses: actions/upload-artifact@v4
        with:
          name: image-source-inventory
          path: out/image-sources
