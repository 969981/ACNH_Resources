name: ACNH R36 Original 891 Failed BWAV Member Native Replay
on:
  push:
    branches: [feat/acnh303-round36-animation-audit]
    paths:
      - '.github/workflows/acnh303-round36-bwav891-audit.yml'
      - 'tools/r36-bwav/**'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: acnh-r36-891-BWAV-replay
  cancel-in-progress: false
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            derived
            tools/r36-bwav
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/requirements-media.txt
      - name: Download this round real four BARS original report artifacts
        run: |
          set -euo pipefail
          mkdir -p real-previous-reports
          gh run download 38680992605 -R 969981/ACNH_Resources \
            --pattern 'r36-report-Sound-*' --dir real-previous-reports
          test "$(find real-previous-reports -type f -name report.json | wc -l)" -eq 8
      - name: Reopen SHA-verified original BARS and classify all 891 BWAV failures
        run: |
          python tools/r36-bwav/failure_replay.py \
            --repo . --reports real-previous-reports \
            --out derived/3.0.3/r36_bwav891/native_failure_classification.json
          python - <<'PY'
          import json
          p='derived/3.0.3/r36_bwav891/native_failure_classification.json'
          j=json.load(open(p))
          assert j['actual_R36_BARS_sources']==160
          assert j['actually_audited_failing_BWAV_members']==891
          assert len(j['all_failed_members_verified'])==891
          assert sum(j['classification'].values())==891
          assert not j['external_sample_payload_proven']
          print('R36 FAILED REAL MEMBERS',j['classification'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r36-891-original-BWAV-native-header-and-payload-audit
          path: derived/3.0.3/r36_bwav891/
      - name: Commit source-backed failure classification report only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse derived/3.0.3/r36_bwav891/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(r36): classify 891 real failed audio members using source member SHA and BWAV channel headers'
          for retry in 1 2 3 4 5 6; do
            git fetch origin feat/acnh303-round36-animation-audit
            git rebase FETCH_HEAD
            if git push origin HEAD:feat/acnh303-round36-animation-audit; then exit 0; fi
            sleep 1
          done
          exit 1
