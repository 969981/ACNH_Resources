name: ACNH303 HASH-008M mail dispatch and bitmap
on:
  push:
    branches: [research]
    paths:
      - 'Scripts/acnh303_hash008m_mail_dispatch.py'
      - '.github/workflows/acnh303-hash008m-mail.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/acnh303_hash008e.py
            /Scripts/acnh303_hash008i.py
            /Scripts/acnh303_hash008m_mail_dispatch.py
            /research/hash008j/mail_category_dictionary.json
            /e10617820db06889e1638499478da0de_NCA/0/main
            /e10617820db06889e1638499478da0de_NCA/0/main.elf
            /e10617820db06889e1638499478da0de_NCA/1/Bcsv/ItemParam.bcsv
            /e10617820db06889e1638499478da0de_NCA/1/Bcsv/ItemMailAttachCategoryGroup.bcsv
            /e10617820db06889e1638499478da0de_NCA/1/Bcsv/MessageCardSelectPresent.bcsv
            /e10617820db06889e1638499478da0de_NCA/1/Bcsv/MessageCardSelectPresentSp.bcsv
      - run: python -m pip install capstone==5.0.3 lz4==4.3.3
      - run: python -m py_compile Scripts/acnh303_hash008m_mail_dispatch.py
      - run: python Scripts/acnh303_hash008m_mail_dispatch.py --out artifacts/hash008m-mail
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ACNH303-HASH008M-MAIL
          path: artifacts/hash008m-mail/
          if-no-files-found: warn
