name: ACNH 3.0.3 | R88 ELF relocation and Ghidra address windows

on:
  workflow_dispatch:
  push:
    branches: [docs/acnh303-json-database-provenance]
    paths:
      - Scripts/acnh303_r88_elf_relocation_probe.py
      - .github/workflows/acnh303-r88-elf-relocation.yml

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout original main ELF, original parser and R88
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/acnh303_r88_elf_relocation_probe.py
            /Scripts/acnh303_round11_elf_xref.py
            /e10617820db06889e1638499478da0de_NCA/0/main.elf
      - name: Install parsers and check syntax
        run: |
          python3 -m pip install pyelftools capstone
          python3 -m py_compile Scripts/acnh303_r88_elf_relocation_probe.py
      - name: Read relocation tables and disassemble original ARM64 windows
        run: python3 Scripts/acnh303_r88_elf_relocation_probe.py --repo-root . --out r88-output
      - uses: actions/upload-artifact@v4
        with:
          name: acnh303-r88-original-native-relocations
          path: r88-output/
          if-no-files-found: error
          retention-days: 30
