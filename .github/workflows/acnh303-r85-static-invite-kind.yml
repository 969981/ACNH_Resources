name: ACNH 3.0.3 | R85 item-kind and NPC invite static evidence

on:
  workflow_dispatch:
  push:
    branches:
      - docs/acnh303-json-database-provenance
    paths:
      - Scripts/acnh303_r85_item_npc_static_audit.py
      - .github/workflows/acnh303-r85-static-invite-kind.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout only original static inputs
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/acnh303_r85_item_npc_static_audit.py
            /UnPack/1/Bcsv/ItemKind.csv
            /UnPack/1/Bcsv/ItemParam.csv
            /UnPack/1/Bcsv/NmlNpcParam.csv
            /UnPack/1/Bcsv/SpNpcParam.csv
            /UnPack/1/Bcsv/AmiiboData.csv
            /UnPack/1/Bcsv/EventFlagsNpcMemoryParam.csv
            /UnPack/1/Bcsv/EventFlagsNpcSaveParam.csv
            /UnPack/1/Bcsv/EventFlagsPlayerParam.csv
            /UnPack/1/EventFlow/NNPC_Spot_Camp_Invite.json
            /UnPack/1/EventFlow/NNPC_Spot_Camp.json
            /UnPack/1/EventFlow/NNPC_Spot_MysteryTour.json
            /UnPack/1/EventFlow/NNPC_Reaction_Moving.json
            /UnPack/1/EventFlow/NNPC_Reaction_First_Acquaintance.json
            /UnPack/1/EventFlow/Obj_RcoMachine_Amiibo.json
            /UnPack/1/EventFlow/Obj_RcoMachine_AmiiboCall.json
            /UnPack/1/EventFlow/System_WherearenNPCMoveMode_Amiibo.json
            /UnPack/1/EventFlow/System_CastUI_Amiibo.json
            /UnPack/1/EventFlow/Obj_Common_AmiiboProcess.json
            /UnPack/1/EventFlow/NNPC_Talk_Situation.json
            /UnPack/1/EventFlow/System_PhotoStudio_Call.json
            /derived/3.0.3/ghidra12.2/c/58/00ee5828.c
            /derived/3.0.3/ghidra12.2/c/89/00f089a0.c

      - name: Validate audit script syntax
        run: python3 -m py_compile Scripts/acnh303_r85_item_npc_static_audit.py

      - name: Audit 11,178 item kinds and 417 normal NPC eligibility as UNKNOWN
        run: python3 Scripts/acnh303_r85_item_npc_static_audit.py --repo-root . --out r85-output

      - name: Upload inspectable source-backed evidence
        uses: actions/upload-artifact@v4
        with:
          name: acnh303-r85-itemkind-npc-invite-static
          path: r85-output/
          if-no-files-found: error
          retention-days: 30
