name: ACNH R39 Native AAL Manager Object Vtables and Path Builder Xrefs
on:
  push:
    branches: [feat/acnh303-round39-bookopen-aal-oneroom]
    paths:
      - '.github/workflows/acnh303-round39-aal-manager.yml'
      - 'scripts/acnh303_round39_aal_manager_xrefs.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /scripts/
            /e10617820db06889e1638499478da0de_NCA/0/ACNH3.0.3.elf
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'capstone>=5,<6'
      - name: Inspect SHA verified 3.0.3 original BgmBase manager and exact AArch64 path-builder code
        run: |
          python scripts/acnh303_round39_aal_manager_xrefs.py \
            --elf e10617820db06889e1638499478da0de_NCA/0/ACNH3.0.3.elf \
            --out derived/3.0.3/r39_aal_manager/original_manager_vtable_and_path_native_code.json
          python - <<'PY'
          import json
          x=json.load(open('derived/3.0.3/r39_aal_manager/original_manager_vtable_and_path_native_code.json'))
          assert x['no_runtime_file_open_or_read_evidence_captured']
          assert x['not_safe_to_name_3e45184_FileOpen']
          assert len(x['first_manager_branches'])>=3
          print('R39_REAL_AAL_OBJECT_VTABLE_STATIC_ONLY',len(x['first_manager_branches']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: acnh-r39-original-ELF-BgmBase-manager-vtable-dispatch-real-instructions
          path: derived/3.0.3/r39_aal_manager/
      - name: Commit original source disassembly without invented runtime semantics
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse derived/3.0.3/r39_aal_manager/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(r39): original Bgm_Base native AAL manager and vtable instruction graph'
          for n in 1 2 3 4 5 6; do
            git fetch origin feat/acnh303-round39-bookopen-aal-oneroom
            git rebase FETCH_HEAD
            if git push origin HEAD:feat/acnh303-round39-bookopen-aal-oneroom; then exit 0; fi
            sleep 2
          done
          exit 1
