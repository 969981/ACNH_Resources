name: ACNH 3.0.3 R93 NPC EventFlags source and integrated bundle
on:
  pull_request:
    paths:
      - 'Scripts/acnh303_r93_npc_eventflags_bundle.py'
      - 'Scripts/acnh_formats.py'
      - 'derived/3.0.3/npc_event_flags/**'
      - 'UnPack/1/Bcsv/EventFlagsNpc*Param.*'
      - 'UnPack/1/Bcsv/EventFlagsPlayerActivityParam.*'
      - 'e10617820db06889e1638499478da0de_NCA/1/Bcsv/EventFlagsNpc*Param.bcsv'
      - 'e10617820db06889e1638499478da0de_NCA/1/Bcsv/EventFlagsPlayerActivityParam.bcsv'
      - '.github/workflows/acnh303-r93-npc-eventflags.yml'
  workflow_dispatch:
  push:
    branches: ['3.0.3_Unpack']
    paths:
      - 'Scripts/acnh303_r93_npc_eventflags_bundle.py'
      - 'Scripts/acnh_formats.py'
      - 'derived/3.0.3/npc_event_flags/**'
      - 'UnPack/1/Bcsv/EventFlagsNpc*Param.*'
      - 'UnPack/1/Bcsv/EventFlagsPlayerActivityParam.*'
      - 'e10617820db06889e1638499478da0de_NCA/1/Bcsv/EventFlagsNpc*Param.bcsv'
      - 'e10617820db06889e1638499478da0de_NCA/1/Bcsv/EventFlagsPlayerActivityParam.bcsv'
      - '.github/workflows/acnh303-r93-npc-eventflags.yml'
permissions:
  contents: read
jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/acnh_formats.py
            /Scripts/acnh303_r93_npc_eventflags_bundle.py
            /derived/3.0.3/npc_event_flags/
            /e10617820db06889e1638499478da0de_NCA/1/Bcsv/EventFlagsNpcMemoryParam.bcsv
            /UnPack/1/Bcsv/EventFlagsNpcMemoryParam.csv
            /UnPack/1/Bcsv/EventFlagsNpcMemoryParam.json
            /e10617820db06889e1638499478da0de_NCA/1/Bcsv/EventFlagsNpcSaveParam.bcsv
            /UnPack/1/Bcsv/EventFlagsNpcSaveParam.csv
            /UnPack/1/Bcsv/EventFlagsNpcSaveParam.json
            /e10617820db06889e1638499478da0de_NCA/1/Bcsv/EventFlagsNpcTempParam.bcsv
            /UnPack/1/Bcsv/EventFlagsNpcTempParam.csv
            /UnPack/1/Bcsv/EventFlagsNpcTempParam.json
            /e10617820db06889e1638499478da0de_NCA/1/Bcsv/EventFlagsPlayerActivityParam.bcsv
            /UnPack/1/Bcsv/EventFlagsPlayerActivityParam.csv
            /UnPack/1/Bcsv/EventFlagsPlayerActivityParam.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Re-decode authentic BCSV and compare every source field
        run: python Scripts/acnh303_r93_npc_eventflags_bundle.py --root . --out artifacts/acnh303-r93-npc-eventflags --verify-committed
      - name: Upload original BCSV, decoded sidecars, processed JSON, integrated JSON and CSV, SHA audit
        uses: actions/upload-artifact@v4
        with:
          name: acnh303-r93-npc-eventflags-raw-decoded-processed-integrated
          path: artifacts/acnh303-r93-npc-eventflags/
          if-no-files-found: error
          retention-days: 90
