name: ACNH 3.0.3 | R62 full original PNG source lookup for all 27531 names
on:
  push:
    branches: [3.0.3_Unpack]
    paths:
      - 'Scripts/acnh303_r62_full_catalog_lookup.py'
      - 'Scripts/test_acnh303_r62_full_catalog_lookup.py'
      - '.github/workflows/acnh303-r62-full-original-source-catalog.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: acnh303-r62-all-native-original-index
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/
            /assets/evidence/rom-items/
            /assets/catalog/
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate strict full catalog data model
        run: python -m unittest discover -s Scripts -p test_acnh303_r62_full_catalog_lookup.py -v
      - name: Index 53 original icon batch SHA manifests and R61 candidate sources
        run: python Scripts/acnh303_r62_full_catalog_lookup.py index
      - name: Verify direct original, candidate and version suffix records are distinct
        shell: bash
        run: |
          set -euo pipefail
          python Scripts/acnh303_r62_full_catalog_lookup.py lookup --name 10000Bell.png
          python Scripts/acnh303_r62_full_catalog_lookup.py lookup --name FtrBambooLamp.png
          python Scripts/acnh303_r62_full_catalog_lookup.py lookup --name CapWigZelda0_0.png
          python Scripts/acnh303_r62_full_catalog_lookup.py lookup --name FtrSoftdrinkOrange_3.0.0.png
      - name: Commit complete original PNG source registry, no image mutation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- assets/catalog/original-27531-sourced-lookup.csv assets/evidence/rom-items/r62-all-27531-source-reconciliation.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'catalog: index all 27531 original 3.0.3 native PNGs and distinct name candidates'
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin 3.0.3_Unpack
            if ! git rebase origin/3.0.3_Unpack; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:3.0.3_Unpack; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
