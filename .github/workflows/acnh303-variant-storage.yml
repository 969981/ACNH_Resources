name: ACNH variant storage routing
on:
  workflow_dispatch:
  push:
    branches: [research]
    paths: ['Scripts/bcsv/audit_variant_storage.py','.github/workflows/acnh303-variant-storage.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Scripts/bcsv
            e10617820db06889e1638499478da0de_NCA/0
            e10617820db06889e1638499478da0de_NCA/1/Bcsv
      - uses: actions/checkout@v4
        with:
          ref: f09e15460d02790060a374b2ad6ba569ba9b97ed
          path: historical
          sparse-checkout: Scripts
      - uses: astral-sh/setup-uv@v6
      - run: uv run --script Scripts/bcsv/audit_variant_storage.py --historical historical
      - uses: actions/upload-artifact@v4
        with:
          name: acnh303-variant-storage
          path: out/variant-storage
  publish:
    needs: audit
    if: github.ref == 'refs/heads/research'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research
          sparse-checkout: research/catalog/variants/storage
      - uses: actions/download-artifact@v4
        with:
          name: acnh303-variant-storage
          path: /tmp/storage
      - run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags --depth=1 origin research
            for p in Scripts/bcsv/audit_variant_storage.py Scripts/bcsv/bcsv.py e10617820db06889e1638499478da0de_NCA; do
              test "$(git rev-parse "$GITHUB_SHA:$p")" = "$(git rev-parse "FETCH_HEAD:$p")"
            done
            baseline="$(git rev-parse "$GITHUB_SHA:research/catalog/variants/storage" 2>/dev/null || true)"
            current="$(git rev-parse "FETCH_HEAD:research/catalog/variants/storage" 2>/dev/null || true)"
            test "$baseline" = "$current"
            git checkout --detach FETCH_HEAD
            mkdir -p research/catalog/variants/storage
            cp /tmp/storage/* research/catalog/variants/storage/
            git add research/catalog/variants/storage
            if git diff --cached --quiet; then exit 0; fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data(catalog): archive original storage routing evidence"
            if git push origin HEAD:research; then exit 0; fi
          done
          exit 1
