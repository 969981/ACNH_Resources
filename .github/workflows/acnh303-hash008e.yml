name: ACNH303 HASH-008E recipe and player cache evidence
on:
  push:
    branches: [research]
    paths:
      - 'Scripts/acnh303_hash008e.py'
      - '.github/workflows/acnh303-hash008e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/acnh303_hash008e.py
            /e10617820db06889e1638499478da0de_NCA/0/main
            /e10617820db06889e1638499478da0de_NCA/0/main.elf
            /e10617820db06889e1638499478da0de_NCA/1/Bcsv/ItemParam.bcsv
            /e10617820db06889e1638499478da0de_NCA/1/Bcsv/RecipeCraftParam.bcsv
            /e10617820db06889e1638499478da0de_NCA/1/Bcsv/PlayerStateParam.bcsv
      - run: python -m pip install capstone==5.0.3 lz4==4.3.3
      - run: python Scripts/acnh303_hash008e.py --out artifacts/hash008e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ACNH303-HASH008E
          path: artifacts/hash008e/
          if-no-files-found: warn
