name: ACNH 3.0.3 | R58 extract native clothing FtrIcon and ClosetIcon images
on:
  push:
    branches: [3.0.3_Unpack]
    paths:
      - 'Scripts/acnh303_r58_clothing_original_png.py'
      - '.github/workflows/acnh303-r58-native-clothing-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: acnh303-r58-original-clothing-native
  cancel-in-progress: false
jobs:
  decode:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/
            /assets/evidence/rom-items/
            /assets/evidence/rom-clothing-layout/
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install BNTX extraction and real PNG validation dependencies
        run: python -m pip install -r Scripts/requirements-media.txt
      - name: Plan exact 78 original layouts and sparse fetch them
        shell: bash
        run: |
          set -euo pipefail
          python Scripts/acnh303_r58_clothing_original_png.py plan --root .
          git sparse-checkout add --stdin < /tmp/acnh-r58-clothing-sparse.txt
      - name: Install SHA256SUMS-verified original BNTX image decoder
        shell: bash
        run: |
          set -euo pipefail
          u=https://github.com/quatric/nintoolbox/releases/download/nightly-20261028
          curl -fLsS --retry 3 "$u/nintoolbox-linux-x86_64.tar.gz" -o /tmp/nintoolbox-linux-x86_64.tar.gz
          curl -fLsS --retry 3 "$u/SHA256SUMS.txt" -o /tmp/SHA256SUMS.txt
          (cd /tmp && grep 'nintoolbox-linux-x86_64.tar.gz$' SHA256SUMS.txt | sha256sum -c -)
          mkdir -p /tmp/nintoolbox
          tar -xzf /tmp/nintoolbox-linux-x86_64.tar.gz -C /tmp/nintoolbox
          find /tmp/nintoolbox -type f -name wimgt | head -n1 > /tmp/wimgt.path
          test -s /tmp/wimgt.path
          chmod +x "$(cat /tmp/wimgt.path)"
      - name: Decode each original FtrIcon and ClosetIcon BRTI and verify PNG hash
        run: python Scripts/acnh303_r58_clothing_original_png.py export --root . --wimgt "$(cat /tmp/wimgt.path)"
      - name: Preserve actual evidence even when decode fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acnh-r58-native-clothing
          path: |
            assets/evidence/rom-clothing-layout/
            assets/images/clothing-original-layout/
            assets/textures/clothing-original-layout/
          retention-days: 30
          if-no-files-found: warn
      - name: Commit distinct native original UI images and independent hashes
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -A -- assets/evidence/rom-clothing-layout
          for d in assets/images/clothing-original-layout assets/textures/clothing-original-layout; do
            if [ -d "$d" ]; then git add --sparse -A -- "$d"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'assets: decode original 3.0.3 clothing FtrIcon and ClosetIcon BRTI textures'
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin 3.0.3_Unpack
            if ! git rebase origin/3.0.3_Unpack; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:3.0.3_Unpack; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
