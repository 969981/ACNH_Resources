name: ACNH furniture variant catalog
on:
  workflow_dispatch:
  push:
    branches: [research]
    paths: ['Scripts/bcsv/build_variants.py','.github/workflows/acnh303-variants.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Scripts/bcsv
            research/bcsv-data/decoded
            e10617820db06889e1638499478da0de_NCA/1/Message
      - uses: actions/checkout@v4
        with:
          ref: f09e15460d02790060a374b2ad6ba569ba9b97ed
          path: historical
          sparse-checkout: |
            Scripts
            assets/evidence/rom-database/r75-original-14-language-archives-and-npc-names.json
      - uses: astral-sh/setup-uv@v6
      - run: uv run --script Scripts/bcsv/build_variants.py --historical historical
      - uses: actions/upload-artifact@v4
        with:
          name: acnh303-variants
          path: out/variants
  publish:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research
          sparse-checkout: research/catalog/variants
      - uses: actions/download-artifact@v4
        with:
          name: acnh303-variants
          path: /tmp/variants
      - run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags --depth=1 origin research
            for p in Scripts/bcsv/build_variants.py research/bcsv-data/decoded e10617820db06889e1638499478da0de_NCA/1 research/catalog/variants; do
              test "$(git rev-parse "$GITHUB_SHA:$p")" = "$(git rev-parse "FETCH_HEAD:$p")" || exit 1
            done
            git checkout --detach FETCH_HEAD
            mkdir -p research/catalog/variants
            cp /tmp/variants/* research/catalog/variants/
            git add research/catalog/variants
            if git diff --cached --quiet; then exit 0; fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data(catalog): archive variant catalog and SQLite"
            if git push origin HEAD:research; then exit 0; fi
          done
          exit 1
