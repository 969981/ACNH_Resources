name: ACNH 3.0.3 R100 BCSV name corpus
on:
  pull_request:
    paths:
      - 'Scripts/acnh303_r100*'
      - 'derived/3.0.3/npc_event_flags/r100_name_corpus/**'
      - '.github/workflows/acnh303-r100-name-corpus.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-r100:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/acnh303_r100_name_corpus.py
            /derived/3.0.3/npc_event_flags/r100_name_corpus/
            /e10617820db06889e1638499478da0de_NCA/0/main.elf
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python Scripts/acnh303_r100_name_corpus.py --selftest
      - run: python Scripts/acnh303_r100_name_corpus.py --root . --out artifacts/r100/report.json --scan-elf
      - uses: actions/upload-artifact@v4
        with:
          name: acnh303-r100-name-corpus
          path: artifacts/r100/
          if-no-files-found: error
