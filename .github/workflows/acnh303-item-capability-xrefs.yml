name: ACNH 3.0.3 item capability XREF candidates
on:
  push:
    branches: [3.0.3_Unpack]
    paths:
      - 'Scripts/acnh303_item_capability_xrefs.py'
      - '.github/workflows/acnh303-item-capability-xrefs.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/
            /UnPack/1/EventFlow/
            /derived/3.0.3/ghidra12.2/c/
            /e10617820db06889e1638499478da0de_NCA/0/main
            /e10617820db06889e1638499478da0de_NCA/0/main.elf
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lz4==4.4.4 capstone==5.0.6
      - run: python -m py_compile Scripts/acnh303_item_capability_xrefs.py
      - run: python Scripts/acnh303_item_capability_xrefs.py --selftest
      - run: python Scripts/acnh303_item_capability_xrefs.py --root . --out artifacts/item-capability-xrefs
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: acnh303-item-capability-xrefs
          path: artifacts/item-capability-xrefs/
          if-no-files-found: error
