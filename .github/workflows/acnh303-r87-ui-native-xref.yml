name: ACNH 3.0.3 | R87 UI enum and native query XREF triage

on:
  workflow_dispatch:
  push:
    branches: [docs/acnh303-json-database-provenance]
    paths:
      - Scripts/acnh303_r87_ui_query_native_probe.py
      - .github/workflows/acnh303-r87-ui-native-xref.yml

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout verified original ELF, BCSV, locale archives and static xref parser
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/acnh303_r87_ui_query_native_probe.py
            /Scripts/acnh303_round11_elf_xref.py
            /Scripts/acnh_formats.py
            /UnPack/1/Bcsv/ItemKind.csv
            /UnPack/1/Bcsv/ItemParam.csv
            /UnPack/1/Bcsv/ItemParam.json
            /UnPack/1/Bcsv/ItemUIFurnitureCategory.csv
            /UnPack/1/Bcsv/ItemOutfitCategory.csv
            /e10617820db06889e1638499478da0de_NCA/0/main.elf
            /e10617820db06889e1638499478da0de_NCA/1/Message/String_CNzh.sarc.zs
            /e10617820db06889e1638499478da0de_NCA/1/Message/String_TWzh.sarc.zs
            /e10617820db06889e1638499478da0de_NCA/1/Message/String_JPja.sarc.zs
            /e10617820db06889e1638499478da0de_NCA/1/Message/String_EUen.sarc.zs
            /derived/3.0.3/ghidra12.2/progress.json
      - name: Install zstandard and check code syntax
        run: |
          python3 -m pip install zstandard
          python3 -m py_compile Scripts/acnh303_r87_ui_query_native_probe.py
      - name: Execute exact original UI categorization and AArch64 xrefs
        run: python3 Scripts/acnh303_r87_ui_query_native_probe.py --repo-root . --out r87-output
      - name: Upload original-source R87 candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: acnh303-r87-original-ui-native-xrefs
          path: r87-output/
          if-no-files-found: error
          retention-days: 30
