name: ACNH 3.0.3 | Extract original ROM item icons (no CDN substitution)
on:
  push:
    branches: [3.0.3_Unpack]
    paths:
      - 'Scripts/acnh303_rom_item_icons.py'
      - '.github/workflows/acnh303-rom-item-icons.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: "pilot or batch"
        type: choice
        options: [pilot, batch]
        default: pilot
        required: true
      limit:
        description: "Max matched icon names to decode (1..500)"
        type: number
        default: 250
        required: true
permissions:
  contents: write
concurrency:
  group: acnh303-native-item-icons-serial-write
  cancel-in-progress: false
jobs:
  decode:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'pilot' }}
      LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || '250' }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/
            /assets/
          persist-credentials: true
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original texture and PNG pixel decoders
        run: python -m pip install -r Scripts/requirements-media.txt
      - name: Compute exact matching ROM source paths without fetching other 60k blobs
        shell: bash
        run: |
          set -euo pipefail
          pilot_flag=()
          if [ "$MODE" = "pilot" ]; then pilot_flag+=(--pilot); fi
          python Scripts/acnh303_rom_item_icons.py plan --root . --limit "$LIMIT" "${pilot_flag[@]}"
          if [ -s /tmp/acnh-rom-icon-sparse.txt ]; then
            git sparse-checkout add --no-cone --stdin < /tmp/acnh-rom-icon-sparse.txt
          fi
      - name: Install checksum-verified pinned nintoolbox genuine BNTX decoder
        shell: bash
        run: |
          set -euo pipefail
          u=https://github.com/quatric/nintoolbox/releases/download/nightly-20261028
          curl -fLsS --retry 3 "$u/nintoolbox-linux-x86_64.tar.gz" -o /tmp/nintoolbox-linux-x86_64.tar.gz
          curl -fLsS --retry 3 "$u/SHA256SUMS.txt" -o /tmp/SHA256SUMS.txt
          (cd /tmp && grep 'nintoolbox-linux-x86_64.tar.gz$' SHA256SUMS.txt | sha256sum -c -)
          mkdir -p /tmp/nintoolbox
          tar -xzf /tmp/nintoolbox-linux-x86_64.tar.gz -C /tmp/nintoolbox
          find /tmp/nintoolbox -type f -name wimgt | head -n1 > /tmp/wimgt.path
          test -s /tmp/wimgt.path
          chmod +x "$(cat /tmp/wimgt.path)"
      - name: Export original ROM layouts into validated PNGs
        run: |
          python Scripts/acnh303_rom_item_icons.py export --root . \
            --wimgt "$(cat /tmp/wimgt.path)"
      - name: Save pixel and provenance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acnh303-original-rom-icons-${{ github.run_id }}
          path: |
            assets/evidence/rom-items/
            assets/images/items-rom/
            assets/textures/items-rom/
          retention-days: 30
          if-no-files-found: warn
      - name: Commit validated ROM PNGs while preserving any older CDN pixels
        if: success() && github.ref == 'refs/heads/3.0.3_Unpack'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- assets/images/items assets/evidence/rom-items
          for p in assets/images/items-rom assets/textures/items-rom; do
            if [ -d "$p" ]; then git add -A -- "$p"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets: direct ACNH 3.0.3 ROM item layout image exports"
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin 3.0.3_Unpack
            if ! git rebase origin/3.0.3_Unpack; then
              paths="$(git diff --name-only --diff-filter=U)"
              if [ "$paths" = "assets/evidence/rom-items/next-offset.json" ]; then
                ours="$(git show :2:assets/evidence/rom-items/next-offset.json | python -c 'import sys,json;print(json.load(sys.stdin)["next_offset"])')"
                theirs="$(git show :3:assets/evidence/rom-items/next-offset.json | python -c 'import sys,json;print(json.load(sys.stdin)["next_offset"])')"
                if [ "$theirs" -ge "$ours" ]; then
                  git checkout --theirs -- assets/evidence/rom-items/next-offset.json
                else
                  git checkout --ours -- assets/evidence/rom-items/next-offset.json
                fi
                git add -- assets/evidence/rom-items/next-offset.json
                GIT_EDITOR=true git rebase --continue
              else
                git rebase --abort || true
                echo "::error::Unresolved image source conflict; no force-push"
                exit 1
              fi
            fi
            if git push origin HEAD:3.0.3_Unpack; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
