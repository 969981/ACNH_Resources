name: ACNH 3.0.3 | R74 research real item and villager metadata and stack fields
on:
  push:
    branches: [3.0.3_Unpack]
    paths:
      - 'Scripts/acnh303_r74_metadata_stack_research.py'
      - '.github/workflows/acnh303-r74-item-metadata-research.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: acnh303-r74-metadata
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/acnh303_r74_metadata_stack_research.py
            /UnPack/1/Bcsv/
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact 3.0.3 original BCSV hashes, join stack and catalog source names
        run: python Scripts/acnh303_r74_metadata_stack_research.py
      - name: Commit provenance evidence, do not mutate ROM files or user-origin image names
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -A -- assets/evidence/rom-database/r74-original-item-npc-stack-schema.json assets/evidence/rom-database/r74-original-item-stack-preview.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: map original 3.0.3 item stack, flags, kind, villager and language source metadata'
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin 3.0.3_Unpack
            if ! git rebase origin/3.0.3_Unpack; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:3.0.3_Unpack; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
