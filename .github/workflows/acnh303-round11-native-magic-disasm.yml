name: ACNH 3.0.3 R11 Native FourCC Magic and Exact ARM64 Disassembly
on:
  push:
    branches: [feat/acnh303-round11-elf-native-consumers]
    paths: ['.github/workflows/acnh303-round11-native-magic-disasm.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /scripts/
            /derived/3.0.3/round11_elf_native_xref/
            /e10617820db06889e1638499478da0de_NCA/0/ACNH3.0.3.elf
          sparse-checkout-cone-mode: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'capstone>=5,<6'
      - name: Regression actual ARM64 fourCC construction in synthetic ELF
        run: |
          python -m compileall -q scripts/acnh303_round11_magic_disasm.py
          python -m unittest discover -s scripts -p 'test_acnh303_round11_magic_disasm.py' -v
      - name: Require old XREF SHA and actual 79MB ELF
        run: |
          test -s derived/3.0.3/round11_elf_native_xref/report.json
          test "$(stat -c '%s' e10617820db06889e1638499478da0de_NCA/0/ACNH3.0.3.elf)" -eq 79000340
      - name: Decode real native code windows and look for AMTA/LBLI/BARS compiled magic
        run: |
          python scripts/acnh303_round11_magic_disasm.py \
            --elf e10617820db06889e1638499478da0de_NCA/0/ACNH3.0.3.elf \
            --xref derived/3.0.3/round11_elf_native_xref/report.json \
            --out derived/3.0.3/round11_native_code_windows/analysis.json
          python - <<'PY'
          import json
          d=json.load(open('derived/3.0.3/round11_native_code_windows/analysis.json'))
          assert d['elf_sha256']=='83970061788f10049e2e60d687571b8dc87e5014521889ac4611a7f6b9c6e180'
          assert d['xref_window_count']>=15
          assert set(d['movz_movk_magic'])=={'AMTA','BARS','BDLI','LBLI'}
          print('REALLY_DISASSEMBLED',d['xref_window_count'],
                {k:len(v['records']) for k,v in d['movz_movk_magic'].items()})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: acnh303-r11-real-elf-arm64-disasm-magic
          path: derived/3.0.3/round11_native_code_windows/analysis.json
          retention-days: 30
      - name: Commit disassembly metadata, not game executable
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -A derived/3.0.3/round11_native_code_windows
          git diff --cached --quiet && exit 0
          git commit -m "research(r11): genuine ARM64 disassembly and magic MOVZ/MOVK candidates"
          git fetch origin feat/acnh303-round11-elf-native-consumers
          git rebase FETCH_HEAD
          git push origin HEAD:feat/acnh303-round11-elf-native-consumers
