name: ACNH 3.0.3 | Incremental verified UnPack
on:
  workflow_dispatch:
    inputs:
      category:
        description: "BCSV, BYML, or L3 real media category"
        type: choice
        required: true
        default: Sound
        options: [Sound, Model, Layout, Bcsv, AnimationInfo, Stage, Param]
      shard:
        description: "Zero-based stable SHA-256 shard"
        type: number
        required: true
        default: 0
      shards:
        description: "Total shard count"
        type: number
        required: true
        default: 8
      skip_count:
        description: "Offset within shard (resume a batch)"
        type: number
        required: true
        default: 0
      max_count:
        description: "Maximum sources per job (1-24)"
        type: number
        required: true
        default: 8

permissions:
  contents: write

concurrency:
  group: acnh303-unpack-incremental-write
  cancel-in-progress: false

jobs:
  verified-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CAT: ${{ inputs.category || 'Sound' }}
      SHARD: ${{ inputs.shard || 0 }}
      SHARDS: ${{ inputs.shards || 8 }}
      SKIP: ${{ inputs.skip_count || 0 }}
      COUNT: ${{ inputs.max_count || 8 }}
      NCA: e10617820db06889e1638499478da0de_NCA
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          filter: blob:none
          sparse-checkout: |
            /Scripts/
            /UnPack/_meta/
          sparse-checkout-cone-mode: false
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned-range Python decoder requirements
        run: python -m pip install -r Scripts/requirements-media.txt

      - name: Compile and test original parsers plus new provenance pipeline
        run: |
          python -m compileall -q Scripts
          python -m unittest discover -s Scripts -p "test_acnh_unpack.py" -v
          python -m unittest discover -s Scripts -p "test_batch_pipeline.py" -v

      - name: Select bounded source shard from complete Git Tree
        run: |
          python Scripts/batch_pipeline.py select \
            --category "$CAT" --shard "$SHARD" --shards "$SHARDS" \
            --skip-count "$SKIP" --max-count "$COUNT"
          git sparse-checkout set --no-cone --stdin < batch_sparse_patterns.txt
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("batch_selection.json").read_text(encoding="utf-8"))
          assert 1 <= len(p["sources"]) <= 24
          assert all(Path(s["path"]).is_file() for s in p["sources"])
          print("Fetched",len(p["sources"]),"actual original files; total in shard",p["matched_in_shard"])
          PY

      - name: Install format-specific known media converters
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CAT" == "Sound" ]]; then
            curl -fLsS --retry 3 \
              https://github.com/vgmstream/vgmstream/releases/download/r2117/vgmstream-linux.zip \
              -o /tmp/vgmstream.zip
            mkdir -p /tmp/vgmstream
            unzip -q /tmp/vgmstream.zip -d /tmp/vgmstream
            find /tmp/vgmstream -type f -name 'vgmstream-cli*' | head -n1 > /tmp/vgmstream.path
            test -s /tmp/vgmstream.path
            chmod +x "$(cat /tmp/vgmstream.path)"
            sha256sum /tmp/vgmstream.zip
          elif [[ "$CAT" == "Model" || "$CAT" == "Layout" ]]; then
            u=https://github.com/quatric/nintoolbox/releases/download/nightly-20261028
            curl -fLsS --retry 3 "$u/nintoolbox-linux-x86_64.tar.gz" -o /tmp/nintoolbox-linux-x86_64.tar.gz
            curl -fLsS --retry 3 "$u/SHA256SUMS.txt" -o /tmp/SHA256SUMS.txt
            (cd /tmp && grep 'nintoolbox-linux-x86_64.tar.gz$' SHA256SUMS.txt | sha256sum -c -)
            mkdir -p /tmp/nintoolbox
            tar -xzf /tmp/nintoolbox-linux-x86_64.tar.gz -C /tmp/nintoolbox
            find /tmp/nintoolbox -type f -name wmdlt | head -n1 > /tmp/wmdlt.path
            find /tmp/nintoolbox -type f -name wimgt | head -n1 > /tmp/wimgt.path
            test -s /tmp/wmdlt.path && test -s /tmp/wimgt.path
            chmod +x "$(cat /tmp/wmdlt.path)" "$(cat /tmp/wimgt.path)"
          fi

      - name: Run source-preserving conversion and emit SHA-256 manifest for every input
        shell: bash
        run: |
          set -euo pipefail
          EXTRA=()
          if [[ "$CAT" == "Sound" ]]; then
            EXTRA+=(--vgmstream "$(cat /tmp/vgmstream.path)")
          elif [[ "$CAT" == "Model" || "$CAT" == "Layout" ]]; then
            EXTRA+=(--wmdlt "$(cat /tmp/wmdlt.path)" --wimgt "$(cat /tmp/wimgt.path)")
          fi
          python Scripts/batch_pipeline.py run --selection batch_selection.json \
            --batch-id "actions-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${EXTRA[@]}"
          python Scripts/batch_pipeline.py verify

      - name: Preserve report and actual outputs in workflow artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acnh303-incremental-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            batch_selection.json
            batch_result.json
            UnPack/_meta/batches/
            UnPack/_meta/run_log.jsonl
          retention-days: 30
          if-no-files-found: warn

      - name: Commit only real converted outputs and provenance back to the default branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "UnPack/1/$CAT" "UnPack/_meta"
          if git diff --cached --quiet; then
            echo "No newly decoded outputs or reports"
            exit 0
          fi
          git commit -m "data(acnh303): verified $CAT bounded decode batch ${GITHUB_RUN_ID}"
          git fetch origin 3.0.3_Unpack
          git rebase origin/3.0.3_Unpack
          git push origin HEAD:3.0.3_Unpack

      - name: Fail green status when no actual decoded output was produced
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          pointer=json.loads(Path("batch_result.json").read_text(encoding="utf-8"))
          report=json.loads(Path(pointer["report"]).read_text(encoding="utf-8"))
          count=report["converted_output_count"]
          print(f"Real SHA-256-verified outputs: {count}; statuses: {report['status_counts']}")
          if count < 1:
              raise SystemExit("No real converted outputs; see committed failure manifest")
          PY
