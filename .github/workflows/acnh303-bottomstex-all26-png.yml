name: ACNH 3.0.3 Convert All 26 BottomsTex Embedded BNTX to PNG
on:
  push:
    branches: [feat/acnh303-bottomstex-forensics]
    paths: [".github/workflows/acnh303-bottomstex-all26-png.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /derived/
            /e10617820db06889e1638499478da0de_NCA/1/Model/BottomsTexApronFox00.Nin_NX_NVN.zs
            /e10617820db06889e1638499478da0de_NCA/1/Model/BottomsTexPantsHalfAloha6.Nin_NX_NVN.zs
            /e10617820db06889e1638499478da0de_NCA/1/Model/BottomsTexPantsHalfBasketball3.Nin_NX_NVN.zs
            /e10617820db06889e1638499478da0de_NCA/1/Model/BottomsTexPantsHalfBoa0.Nin_NX_NVN.zs
            /e10617820db06889e1638499478da0de_NCA/1/Model/BottomsTexPantsHalfExplorer0.Nin_NX_NVN.zs
            /e10617820db06889e1638499478da0de_NCA/1/Model/BottomsTexPantsHalfBoa3.Nin_NX_NVN.zs
            /e10617820db06889e1638499478da0de_NCA/1/Model/BottomsTexPantsHalfBoa6.Nin_NX_NVN.zs
            /e10617820db06889e1638499478da0de_NCA/1/Model/BottomsTexPantsHalfSoccer0.Nin_NX_NVN.zs
            /e10617820db06889e1638499478da0de_NCA/1/Model/BottomsTexPantsHotLace2.Nin_NX_NVN.zs
            /e10617820db06889e1638499478da0de_NCA/1/Model/BottomsTexPantsNormalBondage0.Nin_NX_NVN.zs
            /e10617820db06889e1638499478da0de_NCA/1/Model/BottomsTexPantsNormalChimayo2.Nin_NX_NVN.zs
            /e10617820db06889e1638499478da0de_NCA/1/Model/BottomsTexPantsNormalChino2.Nin_NX_NVN.zs
            /e10617820db06889e1638499478da0de_NCA/1/Model/BottomsTexPantsNormalChino4.Nin_NX_NVN.zs
            /e10617820db06889e1638499478da0de_NCA/1/Model/BottomsTexPantsNormalChino6.Nin_NX_NVN.zs
            /e10617820db06889e1638499478da0de_NCA/1/Model/BottomsTexPantsHalfBoa4.Nin_NX_NVN.zs
            /e10617820db06889e1638499478da0de_NCA/1/Model/BottomsTexPantsHalfFormal1.Nin_NX_NVN.zs
            /e10617820db06889e1638499478da0de_NCA/1/Model/BottomsTexPantsHalfRco00.Nin_NX_NVN.zs
            /e10617820db06889e1638499478da0de_NCA/1/Model/BottomsTexPantsHalfSurf4.Nin_NX_NVN.zs
            /e10617820db06889e1638499478da0de_NCA/1/Model/BottomsTexPantsHotDenimholes1.Nin_NX_NVN.zs
            /e10617820db06889e1638499478da0de_NCA/1/Model/BottomsTexPantsHotMultistripe3.Nin_NX_NVN.zs
            /e10617820db06889e1638499478da0de_NCA/1/Model/BottomsTexPantsHotRunning1.Nin_NX_NVN.zs
            /e10617820db06889e1638499478da0de_NCA/1/Model/BottomsTexPantsHotSequins3.Nin_NX_NVN.zs
            /e10617820db06889e1638499478da0de_NCA/1/Model/BottomsTexPantsHotShaggycheck1.Nin_NX_NVN.zs
            /e10617820db06889e1638499478da0de_NCA/1/Model/BottomsTexPantsHotThai0.Nin_NX_NVN.zs
            /e10617820db06889e1638499478da0de_NCA/1/Model/BottomsTexPantsHotUnder0.Nin_NX_NVN.zs
            /e10617820db06889e1638499478da0de_NCA/1/Model/BottomsTexPantsHotYacht3.Nin_NX_NVN.zs
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r scripts/requirements-media.txt
      - name: Verify texture-only FRES regression and PNG validators
        run: python -m unittest discover -s scripts -p "test_acnh303_media_l3.py" -v
      - name: Fetch pinned native BNTX decoder and SHA256SUMS
        run: |
          set -e
          url=https://github.com/quatric/nintoolbox/releases/download/nightly-20261013
          curl -fLsS --retry 3 "$url/nintoolbox-linux-x86_64.tar.gz" -o /tmp/nintoolbox-linux-x86_64.tar.gz
          curl -fLsS --retry 3 "$url/SHA256SUMS.txt" -o /tmp/SHA256SUMS.txt
          (cd /tmp && grep 'nintoolbox-linux-x86_64.tar.gz$' SHA256SUMS.txt | sha256sum -c -)
          mkdir -p /tmp/nintoolbox
          tar -xzf /tmp/nintoolbox-linux-x86_64.tar.gz -C /tmp/nintoolbox
          find /tmp/nintoolbox -type f -name wimgt | head -1 >/tmp/wimgt.path
          test -s /tmp/wimgt.path
          chmod +x "$(cat /tmp/wimgt.path)"
      - name: Build the 26 exact original source paths from prior SHA256 error report
        run: |
          python - <<'PY'
          import json,pathlib
          origin="e10617820db06889e1638499478da0de_NCA/1/"
          data=json.loads(pathlib.Path("derived/3.0.3/media_scaleout_diagnostics/bfres_errors.json").read_text(encoding="utf-8"))
          errors=data["errors"]
          assert len(errors)==26
          selection={
              "category":"Model", "shard":0, "shards":1, "suffix":".zs",
              "selected_files":len(errors), "paths":[origin+e["source"] for e in errors],
          }
          assert len(set(selection["paths"]))==26
          pathlib.Path("selection.json").write_text(json.dumps(selection,ensure_ascii=False,indent=2)+"\n","utf-8")
          PY
      - name: Convert every real BottomsTex FRES embedded standalone BNTX to validated PNGs
        run: |
          python scripts/acnh303_media_batch.py --root . --selection selection.json \
            --out Unpack_BottomsTex --report-dir derived/3.0.3/bottomstex_png_batch \
            --tool-wmdlt /nonexistent/wmdlt \
            --tool-wimgt "$(cat /tmp/wimgt.path)"
      - name: Enforce all 26 formerly-failed original sources now have true raster-decoded PNG
        run: |
          python - <<'PY'
          import json,hashlib,pathlib
          summary=json.loads(pathlib.Path("derived/3.0.3/bottomstex_png_batch/Model/000-of-001/summary.json").read_text())
          rows=json.loads(pathlib.Path("derived/3.0.3/bottomstex_png_batch/Model/000-of-001/manifest.json").read_text())
          old=json.loads(pathlib.Path("derived/3.0.3/media_scaleout_diagnostics/bfres_errors.json").read_text())["errors"]
          expected={r["source"]:r["source_sha256"] for r in old}
          assert len(rows)==len(expected)==26
          count=0
          for row in rows:
              assert row["source_path"] in expected
              assert row["sha256"]==expected[row["source_path"]]
              assert row["source_media_class"]=="texture_only_fres_bntx"
              assert row["status"]=="converted_media",(row["source_path"],row["status"],row["parser_errors"])
              assert len(row["validated_outputs"])>0
              for output in row["validated_outputs"]:
                  assert output["validation"]["type"]=="png"
                  assert output["validation"]["pixel_decode"]=="Pillow.Image.load"
                  file=pathlib.Path(output["path"])
                  assert file.is_file()
                  assert hashlib.sha256(file.read_bytes()).hexdigest()==output["sha256"]
                  count+=1
          assert summary["validated_media_files"]==count
          assert summary["status_counts"]=={"converted_media":26}
          print("ALL26_VERIFIED_PNGS",count,"bytes",summary["validated_media_bytes"],flush=True)
          out=pathlib.Path("derived/3.0.3/bottomstex_png_batch/all26_proof.json")
          out.write_text(json.dumps({"original_fres_sources":26,"validated_pngs":count,
             "validated_png_bytes":summary["validated_media_bytes"],
             "source_manifest": "Model/000-of-001/manifest.json",
             "native_converter":"wimgt nightly-20261013 upstream SHA256SUMS verified",
             "finding":"These 26 FRES resources have no FMDL/FSHP/FVTX, only embedded BNTX.",
             "original_wmdlt_failure_count":26},indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acnh303-bottomstex-all26-png-reports
          path: |
            selection.json
            derived/3.0.3/bottomstex_png_batch/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acnh303-bottomstex-all26-png-data
          path: Unpack_BottomsTex/
          compression-level: 3
          retention-days: 14
          if-no-files-found: warn
      - name: Persist complete 26-source verified PNG manifest to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -A derived/3.0.3/bottomstex_png_batch/
          git diff --cached --quiet && exit 0
          git commit -m "data(acnh303): validate real PNG extraction from 26 texture-only FRES assets"
          git fetch origin feat/acnh303-bottomstex-forensics
          git rebase origin/feat/acnh303-bottomstex-forensics
          git push origin HEAD:feat/acnh303-bottomstex-forensics
