name: ACNH native MSBT label rules
on:
  workflow_dispatch:
  push:
    branches: [research]
    paths: ['Scripts/message/audit_label_rules.py','.github/workflows/acnh303-msbt-label-rules.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Scripts/message
            research/bcsv-data/decoded
            e10617820db06889e1638499478da0de_NCA/1/Message
      - uses: actions/checkout@v4
        with:
          ref: f09e15460d02790060a374b2ad6ba569ba9b97ed
          path: historical
          sparse-checkout: |
            Scripts
            assets/evidence/rom-database/r75-original-14-language-archives-and-npc-names.json
      - uses: astral-sh/setup-uv@v6
      - run: uv run --script Scripts/message/audit_label_rules.py --historical historical
      - uses: actions/upload-artifact@v4
        with:
          name: acnh303-msbt-label-rules
          path: out/message-label-rules
  publish:
    needs: audit
    if: github.ref == 'refs/heads/research'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research
          sparse-checkout: research/message-label-rules
      - uses: actions/download-artifact@v4
        with:
          name: acnh303-msbt-label-rules
          path: /tmp/rules
      - shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags --depth=1 origin research
            for p in Scripts/message/audit_label_rules.py research/bcsv-data/decoded e10617820db06889e1638499478da0de_NCA/1/Message research/message-label-rules; do
              test "$(git rev-parse "$GITHUB_SHA:$p")" = "$(git rev-parse "FETCH_HEAD:$p")" || { echo "Changed input or destination: $p"; exit 1; }
            done
            git reset --hard FETCH_HEAD
            mkdir -p research/message-label-rules
            cp /tmp/rules/* research/message-label-rules/
            git add research/message-label-rules
            if git diff --cached --quiet; then exit 0; fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data(message): archive native label rule coverage and candidate bindings"
            if git push origin HEAD:research; then exit 0; fi
          done
          exit 1
