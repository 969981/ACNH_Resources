name: ACNH 3.0.3 | R8 ordinary media versus R19 SHA reconciliation

on:
  pull_request:
    paths:
      - 'Scripts/acnh303_r8_r19_media_reconcile.py'
      - 'Scripts/test_acnh303_r8_r19_media_reconcile.py'
      - 'docs/16-R8-R19-Cumulative-Media-Reconciliation.md'
      - '.github/workflows/acnh303-r8-r19-media-reconcile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r8-r19-published-manifest-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          lfs: false
          sparse-checkout: |
            /Scripts/
            /UnPack/_meta/history_sha_merge/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fail-closed unit tests
        run: |
          python -m compileall -q Scripts/acnh303_r8_r19_media_reconcile.py
          python -m unittest discover -s Scripts -p 'test_acnh303_r8_r19_media_reconcile.py' -v
      - name: Download authentic R8 ordinary media and R19 cumulative manifests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p history-inputs/r8-media history-inputs/r19
          gh release download acnh303-l3-layout-ui2d-bwav-round8-20261014 \
            -R "$GH_REPO" -D history-inputs/r8-media \
            -p media_source_manifest.jsonl.gz -p SHA256SUMS.txt
          gh release download acnh303-r19-animation-native-20261014 \
            -R "$GH_REPO" -D history-inputs/r19 \
            -p media_source_manifest.jsonl.gz -p SHA256SUMS.txt
          test -s history-inputs/r8-media/media_source_manifest.jsonl.gz
          test -s history-inputs/r19/media_source_manifest.jsonl.gz
      - name: Independently compare published source PATH SHA256 and bytes
        run: |
          python Scripts/acnh303_r8_r19_media_reconcile.py \
            --r8 history-inputs/r8-media \
            --r19 history-inputs/r19 \
            --ledger UnPack/_meta/history_sha_merge/source_ledger.jsonl.gz \
            --coverage UnPack/_meta/history_sha_merge/coverage.json \
            --out audit-output/r8_r19_cumulative_media_reconcile.json
      - name: Verify read-only provenance boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('audit-output/r8_r19_cumulative_media_reconcile.json').read_text())
          assert r['r8_sources']==1112
          assert r['r19_media_sources']==3558
          assert r['new_imported_ledger_source_records']==0
          assert r['rom_bytes_rehashed_in_current_ci'] is False
          assert r['native_runtime_semantics_verified'] is False
          assert r['r8_in_r19_same_original_identity']+r['r8_not_in_r19']==1112
          assert r['r8_in_current_ledger_same_original_identity']+r['r8_not_in_current_ledger']==1112
          print('R8/R19 exact original SHA audit passed:',r['r8_in_r19_same_original_identity'],'overlap,',r['r8_not_in_r19'],'missing R19')
          print('R8/current ledger:',r['r8_in_current_ledger_same_original_identity'],'overlap,',r['r8_not_in_current_ledger'],'candidates')
          PY
      - name: Save audit report only (no automatic ledger mutation)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acnh303-r8-r19-media-audit-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
          if-no-files-found: warn
