name: ACNH 3.0.3 R99 relocation and camp failure table
on:
  pull_request:
    paths:
      - 'Scripts/acnh303_r99*'
      - 'derived/3.0.3/npc_event_flags/r99/**'
      - '.github/workflows/acnh303-r99-relocation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-r99:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/acnh303_r95_native_eventflags.py
            /Scripts/acnh303_r96_native_tables.py
            /Scripts/acnh303_round11_elf_xref.py
            /Scripts/acnh303_r99_relocation.py
            /Scripts/acnh303_r99_nso_verify.py
            /derived/3.0.3/ghidra12.2/c/
            /e10617820db06889e1638499478da0de_NCA/0/main.elf
            /e10617820db06889e1638499478da0de_NCA/0/main
            /UnPack/1/Bcsv/EventFlagsPlayerParam.csv
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Original ELF relocation and native anchors
        run: python Scripts/acnh303_r99_relocation.py --root . --out artifacts/acnh303-r99
      - name: Cross-check original NSO MOD0 and disassemble camp entry
        run: |
          python -m pip install lz4==4.4.4 capstone==5.0.6
          python Scripts/acnh303_r99_nso_verify.py --root . --out artifacts/acnh303-r99
      - uses: actions/upload-artifact@v4
        with:
          name: acnh303-r99-relocation-and-camp-failure
          path: artifacts/acnh303-r99/
          if-no-files-found: error
          retention-days: 90
