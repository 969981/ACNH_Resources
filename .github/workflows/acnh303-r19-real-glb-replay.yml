name: ACNH 3.0.3 | Real R19 BFRES to GLB replay

on:
  pull_request:
    paths:
      - 'Scripts/acnh303_r19_real_glb_replay.py'
      - 'Scripts/test_acnh303_r19_real_glb_replay.py'
      - 'docs/19-Real-BFRES-GLB-R19-Replay.md'
      - '.github/workflows/acnh303-r19-real-glb-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-r19-model-glb:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout parsers without preselected original bytes
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          lfs: false
          sparse-checkout: |
            /Scripts/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install authentic BFRES parsing and GLB validation requirements
        run: python -m pip install -r Scripts/requirements-media.txt
      - name: Reject fabricated R19 selections and converter success
        run: |
          python -m unittest discover -s Scripts -p 'test_acnh303_r19_real_glb_replay.py' -v
          python -m unittest discover -s Scripts -p 'test_acnh303_media_l3.py' -v
      - name: Download exact R19 Release per-original media manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p history-inputs/r19
          gh release download acnh303-r19-animation-native-20261014 \
            -R "$GH_REPO" -D history-inputs/r19 \
            -p media_source_manifest.jsonl.gz -p SHA256SUMS.txt
          test -s history-inputs/r19/media_source_manifest.jsonl.gz
          test -s history-inputs/r19/SHA256SUMS.txt
      - name: Select four GLB-positive R19 Model originals and actual Git blobs
        shell: bash
        run: |
          set -euo pipefail
          python Scripts/acnh303_r19_real_glb_replay.py select \
            --root . --release history-inputs/r19 --count 4 \
            --plan r19_glb_replay_plan.json --sparse r19_glb_sources.sparse
          git sparse-checkout add --stdin < r19_glb_sources.sparse
      - name: Obtain actual original BFRES/GLB converter with published SHA256
        shell: bash
        run: |
          set -euo pipefail
          u=https://github.com/quatric/nintoolbox/releases/download/nightly-20261028
          curl -fLsS --retry 3 "$u/nintoolbox-linux-x86_64.tar.gz" -o /tmp/nintoolbox-linux-x86_64.tar.gz
          curl -fLsS --retry 3 "$u/SHA256SUMS.txt" -o /tmp/SHA256SUMS.txt
          (cd /tmp && grep 'nintoolbox-linux-x86_64.tar.gz$' SHA256SUMS.txt | sha256sum -c -)
          mkdir -p /tmp/nintoolbox
          tar -xzf /tmp/nintoolbox-linux-x86_64.tar.gz -C /tmp/nintoolbox
          find /tmp/nintoolbox -type f -name wmdlt -print -quit > /tmp/wmdlt.path
          test -s /tmp/wmdlt.path
          chmod +x "$(cat /tmp/wmdlt.path)"
      - name: Re-decode real BFRES original files into newly validated GLB
        shell: bash
        run: |
          set -euo pipefail
          python Scripts/acnh303_r19_real_glb_replay.py run \
            --root . --plan r19_glb_replay_plan.json \
            --wmdlt "$(cat /tmp/wmdlt.path)" \
            --out audit/model-l3-r19
      - name: Validate only fresh real L3 success, never Native parity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('audit/model-l3-r19/model_l3_replay_report.json').read_text())
          assert r['selected']==r['fresh_original_bytes_verified']==4
          assert r['sources_with_fresh_verified_GLBS'] >= 1
          assert r['output_files_verified'] >= 1
          assert r['native_runtime_evidence_captured'] is False
          assert r['all_model_geometry_animation_and_native_parity_verified'] is False
          for row in r['rows']:
              assert row['fresh_original_bytes_and_git_blob_verified']
              for out in row['output']:
                  assert out['validation']['meshes'] >= 1
                  assert out['validation']['primitives'] >= 1
          print('REAL Model L3 re-decoded source count:',r['sources_with_fresh_verified_GLBS'])
          print('Native runtime parity: NOT_CAPTURED')
          PY
      - name: Preserve inspectable new media and source byte evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acnh303-r19-fresh-real-bfres-glb-${{ github.run_id }}
          path: |
            r19_glb_replay_plan.json
            audit/model-l3-r19/
          retention-days: 30
          if-no-files-found: warn
