name: ACNH 3.0.3 | R75 verify 14 native-language String archives and NPC labels
on:
  push:
    branches: [3.0.3_Unpack]
    paths:
      - 'Scripts/acnh303_r75_original_message_npc_audit.py'
      - '.github/workflows/acnh303-r75-14-language-archive-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: acnh303-r75-language-npc
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/acnh303_r75_original_message_npc_audit.py
            /Scripts/acnh_formats.py
            /UnPack/1/Bcsv/NmlNpcParam.csv
            /UnPack/1/Bcsv/SpNpcParam.csv
            /e10617820db06889e1638499478da0de_NCA/1/Message/String_*.sarc.zs
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source archive zstd reader
        run: python -m pip install zstandard
      - name: Inventory native multilingual SARC members and exact 491 NPC resources
        run: python Scripts/acnh303_r75_original_message_npc_audit.py
      - name: Commit only original source metadata and hashing evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -A -- assets/evidence/rom-database/r75-original-14-language-archives-and-npc-names.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: inventory real 14 language String SARC and 417+74 NPC resource identities'
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin 3.0.3_Unpack
            if ! git rebase origin/3.0.3_Unpack; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:3.0.3_Unpack; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
