name: ACNH 3.0.3 R34 New Media, UI2D, BARS and BNSH
on:
  push:
    branches: [feat/acnh303-round34-fska-bwav-bnsh106]
    paths:
      - '.github/workflows/acnh303-round34-unpack.yml'
      - 'scripts/acnh303_round34_select.py'
      - 'scripts/acnh303_round34_reconcile.py'
      - 'scripts/acnh303_round34_release_verify.py'
      - 'scripts/test_acnh303_round34.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: acnh303-r34-real-unpack
  cancel-in-progress: false
jobs:
  regress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            derived
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/requirements-media.txt
      - name: Syntax, source counts, safety and existing decoder tests
        run: |
          python -m compileall -q scripts/acnh303_round34_*.py
          python -m unittest discover -s scripts -p 'test_acnh303_round34.py' -v
          python -m unittest discover -s scripts -p 'test_acnh303_media_l3.py' -v
          python -m unittest discover -s scripts -p 'test_acnh303_ui2d_parser.py' -v
  unpack:
    needs: regress
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {category: Model, suffix: ".zs", shard: 0, shards: 4, cap: 20, mode: media}
          - {category: Model, suffix: ".zs", shard: 1, shards: 4, cap: 20, mode: media}
          - {category: Model, suffix: ".zs", shard: 2, shards: 4, cap: 20, mode: media}
          - {category: Model, suffix: ".zs", shard: 3, shards: 4, cap: 20, mode: media}
          - {category: Layout, suffix: ".zs", shard: 0, shards: 4, cap: 37, mode: media}
          - {category: Layout, suffix: ".zs", shard: 1, shards: 4, cap: 37, mode: media}
          - {category: Layout, suffix: ".zs", shard: 2, shards: 4, cap: 37, mode: media}
          - {category: Layout, suffix: ".zs", shard: 3, shards: 4, cap: 37, mode: media}
          - {category: Sound, suffix: ".bars", shard: 0, shards: 4, cap: 40, mode: bars}
          - {category: Sound, suffix: ".bars", shard: 1, shards: 4, cap: 40, mode: bars}
          - {category: Sound, suffix: ".bars", shard: 2, shards: 4, cap: 40, mode: bars}
          - {category: Sound, suffix: ".bars", shard: 3, shards: 4, cap: 40, mode: bars}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            derived
          sparse-checkout-cone-mode: true
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/requirements-media.txt
      - name: Select 388 untouched original sources excluded by R19 R27 R28 R29
        run: |
          python scripts/acnh303_round34_select.py --category '${{ matrix.category }}' \
            --suffix '${{ matrix.suffix }}' --shard '${{ matrix.shard }}' \
            --shards '${{ matrix.shards }}' --count '${{ matrix.cap }}'
      - name: Install tested native media decoders
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ matrix.mode }}' = 'bars' ]; then
            curl -fLsS --retry 3 https://github.com/vgmstream/vgmstream/releases/download/r2117/vgmstream-linux.zip -o /tmp/vgmstream.zip
            mkdir -p /tmp/vgmstream
            unzip -q /tmp/vgmstream.zip -d /tmp/vgmstream
            find /tmp/vgmstream -name 'vgmstream-cli*' -type f | head -n1 > /tmp/vgmstream.path
            test -s /tmp/vgmstream.path
            chmod +x "$(cat /tmp/vgmstream.path)"
            echo /nonexistent/wmdlt >/tmp/wmdlt.path
            echo /nonexistent/wimgt >/tmp/wimgt.path
          else
            u=https://github.com/quatric/nintoolbox/releases/download/nightly-20261013
            curl -fLsS --retry 3 "$u/nintoolbox-linux-x86_64.tar.gz" -o /tmp/nintoolbox.tar.gz
            curl -fLsS --retry 3 "$u/SHA256SUMS.txt" -o /tmp/nintoolbox.sha256
            (cd /tmp && grep 'nintoolbox-linux-x86_64.tar.gz$' nintoolbox.sha256 | sed 's/nintoolbox-linux-x86_64.tar.gz/nintoolbox.tar.gz/' | sha256sum -c -)
            mkdir -p /tmp/nintoolbox
            tar -xzf /tmp/nintoolbox.tar.gz -C /tmp/nintoolbox
            find /tmp/nintoolbox -type f -name wimgt | head -n1 >/tmp/wimgt.path
            find /tmp/nintoolbox -type f -name wmdlt | head -n1 >/tmp/wmdlt.path
            chmod +x "$(cat /tmp/wimgt.path)" "$(cat /tmp/wmdlt.path)"
            echo /nonexistent/vgmstream >/tmp/vgmstream.path
          fi
      - name: Convert original BFRES / BNTX to verified GLB or PNG
        if: matrix.mode == 'media'
        run: |
          python scripts/acnh303_media_batch.py --root . --selection selection.json \
            --out Unpack_L3_Round34 --report-dir derived/3.0.3/media_round34 \
            --tool-wmdlt "$(cat /tmp/wmdlt.path)" --tool-wimgt "$(cat /tmp/wimgt.path)" \
            --tool-vgmstream "$(cat /tmp/vgmstream.path)"
      - name: Decode Layout BFLYT / BFLAN / FCPX structures
        if: matrix.category == 'Layout'
        run: |
          python scripts/acnh303_layout_semantic_shard.py --root . --selection selection.json \
            --output Unpack_UI2D_Round34 --report-dir derived/3.0.3/layout_semantic_round34
      - name: Losslessly export previously unseparated nested BNSH bytes
        if: matrix.category == 'Layout'
        run: |
          python scripts/acnh303_round27_bnsh_extract.py --selection selection.json \
            --out Unpack_BNSH_Round34 \
            --report derived/3.0.3/bnsh_round34/bnsh_${{ matrix.shard }}/bnsh_manifest.json
      - name: Decode BARS member BWAV to actual playable PCM
        if: matrix.mode == 'bars'
        run: |
          python scripts/acnh303_bars_audio_l3.py --selection selection.json \
            --out Unpack_BARS_Round34 --report derived/3.0.3/bars_round34/bars_${{ matrix.shard }} \
            --tool-vgmstream "$(cat /tmp/vgmstream.path)"
      - name: Preserve exact AMTA v5 binary metadata
        if: matrix.mode == 'bars'
        run: |
          python scripts/acnh303_bars_amta_export.py --selection selection.json \
            --out Unpack_AMTA_Round34 --report derived/3.0.3/amta_round34/amta_${{ matrix.shard }}
      - name: Verify every source and derived file SHA256 within shard
        run: |
          python - <<'PY'
          import json,hashlib,pathlib
          s=json.load(open('selection.json'))
          sha=lambda path:hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
          selected={p.split('/1/',1)[1] for p in s['paths']}
          assert len(selected)==s['selected_files']
          root=pathlib.Path('e10617820db06889e1638499478da0de_NCA/1')
          kind=s['category']; i=s['shard']
          if kind=='Sound':
              docs=[json.load(open(f'derived/3.0.3/{prefix}_round34/{prefix}_{i}/report.json'))
                    for prefix in ('bars','amta')]
              for d in docs:
                  assert {r['source_path'] for r in d['records']}==selected
                  for r in d['records']:
                      assert sha(root/r['source_path'])==r['source_sha256']
                      for m in r['members']:
                          if m['status']=='converted_pcm_wav':
                              assert sha(m['output_path'])==m['output_sha256']
                              assert m['validation']['frames']>0
                          if m['status']=='lossless_amta_extracted':
                              assert sha(m['output_path'])==m['amta_sha256']
                              assert m['native']['version_hex']=='0x0500'
          else:
              p=f'derived/3.0.3/media_round34/{kind}/{i:03d}-of-004/manifest.json'
              a=json.load(open(p))
              assert {r['source_path'] for r in a}==selected
              for r in a:
                  assert sha(root/r['source_path'])==r['sha256']
                  for out in r['validated_outputs']:
                      assert sha(out['path'])==out['sha256']
                      assert out['validation']['type'] in ('glb','png')
              if kind=='Layout':
                  u=json.load(open(f'derived/3.0.3/layout_semantic_round34/Layout/{i:03d}-of-004/semantic_manifest.json'))
                  b=json.load(open(f'derived/3.0.3/bnsh_round34/bnsh_{i}/bnsh_manifest.json'))
                  assert len(u['source_records'])==len(b['records'])==len(a)
                  byname={r['source_path']:r['sha256'] for r in a}
                  for r in u['source_records']:
                      assert r['source_sha256']==byname[r['source_path']]
                      for leaf in r['leaves']:
                          if 'output_path' in leaf:
                              assert sha(leaf['output_path'])==leaf['output_sha256']
                  for r in b['records']:
                      assert r['source_sha256']==byname[r['source_path']]
                      for leaf in r['bnsh_members']:
                          if leaf['status']=='exact_native_bnsh_extracted':
                              assert sha(leaf['output_path'])==leaf['output_sha256']==leaf['member_sha256']
          print('R34 ORIGINALS AND OUTPUTS VERIFIED',kind,i,len(selected))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r34-report-${{ matrix.category }}-${{ matrix.shard }}
          path: |
            derived/3.0.3/media_round34/
            derived/3.0.3/layout_semantic_round34/
            derived/3.0.3/bnsh_round34/
            derived/3.0.3/bars_round34/
            derived/3.0.3/amta_round34/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: r34-data-${{ matrix.category }}-${{ matrix.shard }}
          path: |
            Unpack_L3_Round34/
            Unpack_UI2D_Round34/
            Unpack_BNSH_Round34/
            Unpack_BARS_Round34/
            Unpack_AMTA_Round34/
          if-no-files-found: error
          compression-level: 2
  reconcile:
    needs: [regress,unpack]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            derived
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: r34-report-*
          path: collected
      - name: Independently reconcile R34 388 originals, BNSH and output counts
        run: |
          python scripts/acnh303_round34_reconcile.py --collected collected \
            --out derived/3.0.3/r34_cumulative
      - name: Check delta source identities and historical zero overlap
        run: |
          python - <<'PY'
          import gzip,json
          r=json.load(open('derived/3.0.3/r34_cumulative/coverage.json'))
          with gzip.open('derived/3.0.3/r34_cumulative/source_delta.jsonl.gz','rt') as f:
              d=[json.loads(line) for line in f if line.strip()]
          assert len(d)==388 and len(set(x['source_path'] for x in d))==388
          assert (r['delta_model_sources'],r['delta_layout_sources'],r['delta_bars_sources'])==(80,148,160)
          assert r['baseline_r19_r27_r28_r29_r30_r31_r32_r33_media_sources']==4106
          assert r['authoritative_original_inventory']==103400
          print('R34 DELTA CHECKED',r['r34_core_media_by_type'],r['r34_bars_pcm_wav'],
                r['r34_bars_native_amta'],r['r34_lossless_bnsh_members'])
          PY
      - name: Commit SHA-verifiable compact result ONLY to R34 branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse derived/3.0.3/r34_cumulative
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(r34): 388 new original source SHA audits and 12 shard real outputs'
          for retry in 1 2 3 4 5 6 7 8; do
            git fetch origin feat/acnh303-round34-fska-bwav-bnsh106
            git rebase FETCH_HEAD
            if git push origin HEAD:feat/acnh303-round34-fska-bwav-bnsh106; then exit 0; fi
            sleep 1
          done
          exit 1
  publish:
    needs: reconcile
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: 969981/ACNH_Resources
      TAG: acnh303-r34-388-real-media-bnsh-20261015
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/acnh303-round34-fska-bwav-bnsh106
          filter: blob:none
          sparse-checkout: |
            scripts
            derived
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: r34-data-*
          path: actual_data
      - uses: actions/download-artifact@v4
        with:
          pattern: r34-report-*
          path: actual_reports
      - name: Rehash every real output from this exact run (no report-only publication)
        run: |
          python scripts/acnh303_round34_release_verify.py \
            --data actual_data --reports actual_reports \
            --out r34-release-verification.json
      - name: Package verified real outputs into durable Release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releasefiles
          for d in actual_data/r34-data-*; do
            test -d "$d"
            base="$(basename "$d")"
            tar -czf "releasefiles/$base.tar.gz" -C "$d" .
          done
          test "$(find releasefiles -name 'r34-data-*.tar.gz' | wc -l)" -eq 12
          cp derived/3.0.3/r34_cumulative/coverage.json releasefiles/
          cp derived/3.0.3/r34_cumulative/source_delta.jsonl.gz releasefiles/
          cp r34-release-verification.json releasefiles/
          (cd releasefiles && sha256sum * > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          printf 'ACNH 3.0.3 R34: 388 previously untested original resource archives excluding all R19+R27+R28+R29+R30+R31+R32+R33 originals; real BFRES/PNG, Layout UI2D, BARS native WAV/AMTA, and byte-exact Layout BNSH extractions. All payloads were rehashed from this Actions run. This does not prove full semantic or all-resource completion.\n' > notes.txt
          if ! gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$REPO" \
              --target feat/acnh303-round34-fska-bwav-bnsh106 \
              --title 'ACNH 3.0.3 R34 - 388 New Originals Model Layout BARS and BNSH' \
              --notes-file notes.txt --prerelease
          fi
          gh release upload "$TAG" -R "$REPO" releasefiles/* --clobber
          gh release view "$TAG" -R "$REPO" --json url,assets \
            --jq '{url:.url,assets:[.assets[]|{name:.name,size:.size}]}'
