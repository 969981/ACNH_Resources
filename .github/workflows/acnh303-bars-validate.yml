name: ACNH 3.0.3 Five BARS Length Discrepancies
on:
  push:
    branches: [feat/acnh303-assets-eventflow]
    paths: [".github/workflows/acnh303-bars-validate.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /e10617820db06889e1638499478da0de_NCA/1/Sound/Resource/BGM_DJ_016_Ska.bars
            /e10617820db06889e1638499478da0de_NCA/1/Sound/Resource/BGM_DJ_026_Minyo.bars
            /e10617820db06889e1638499478da0de_NCA/1/Sound/Resource/BGM_DJ_107_Android.bars
            /e10617820db06889e1638499478da0de_NCA/1/Sound/Resource/FtrGlobe.bars
            /e10617820db06889e1638499478da0de_NCA/1/Sound/Resource/PhotoStudio_Wind.bars
            /e10617820db06889e1638499478da0de_NCA/1/Sound/Resource/AirportDemoAirplaneShadow.bars
      - name: Compare actual BARS embedded sizes against real file trailers
        run: |
          python - <<'PY'
          import pathlib,struct
          root=pathlib.Path("e10617820db06889e1638499478da0de_NCA/1/Sound/Resource")
          for p in sorted(root.glob("*.bars")):
              b=p.read_bytes()
              n=int.from_bytes(b[4:8],"little")
              count=int.from_bytes(b[12:16],"little")
              print(p.name,"actual",len(b),"reported",n,"delta",len(b)-n,
                    "count",count,"tail",b[-16:].hex(),"header",b[:20].hex())
          PY

      - name: Assert corrected BARS parsing, including 5 validated trailing NUL bytes
        run: |
          python - <<'PY'
          import pathlib,sys
          sys.path.insert(0,"scripts")
          from acnh303_asset_batch import parse_bars
          root=pathlib.Path("e10617820db06889e1638499478da0de_NCA/1/Sound/Resource")
          files=sorted(root.glob("*.bars"))
          for p in files:
              doc=parse_bars(p.read_bytes())
              expected=0 if p.name=="AirportDemoAirplaneShadow.bars" else 1
              assert doc["trailing_padding_bytes"]==expected,(p.name,doc)
              print("PARSED",p.name,"assets",doc["count"],"padding",expected,flush=True)
          assert len(files)==6
          PY
