name: ACNH R37 Actual CPU-Skinned PlayerBody Vertices Mesh-Space Replay
on:
  push:
    branches: [feat/acnh303-round37-animation-pose-ibm-bgm-base]
    paths:
      - '.github/workflows/acnh303-round37-meshskin.yml'
      - 'scripts/acnh303_round37_mesh_local_skin.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  skin:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            derived
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3'
      - name: Download real R35 and R36 source-SHA locked GLB meshes
        run: |
          set -euo pipefail
          mkdir -p input/R35 input/R36
          gh release download acnh303-r35-playerbody-skin-fska-animated-glb-20261015 -R 969981/ACNH_Resources --dir input/R35 --pattern 'PlayerBody_3_FSKA_frame_sampled.glb'
          gh release download acnh303-r36-fskl-ibm-restored-animated-glb-20261015 -R 969981/ACNH_Resources --dir input/R36 --pattern 'PlayerBody_FSKL_IBM_gated_FSKA_3clips.glb'
          echo '4742148c5f4066b68f76b50028dca4ccca440672529e662ea7b7158f626ab597  input/R35/PlayerBody_3_FSKA_frame_sampled.glb' | sha256sum -c -
          echo '4bbb618f8bbeefacf7384a23c60160a1f9c5b55b32ecd8eb1a626819f8138ab3  input/R36/PlayerBody_FSKL_IBM_gated_FSKA_3clips.glb' | sha256sum -c -
      - name: Evaluate actual POSITION, JOINTS and WEIGHTS in five mesh-space skinned assemblies
        run: |
          python scripts/acnh303_round37_mesh_local_skin.py \
            --r35 input/R35/PlayerBody_3_FSKA_frame_sampled.glb \
            --r36 input/R36/PlayerBody_FSKL_IBM_gated_FSKA_3clips.glb \
            --out derived/3.0.3/r37_meshskin/actual_cpu_skinning_mesh_frame_comparison.json
          python - <<'PY'
          import json
          x=json.load(open('derived/3.0.3/r37_meshskin/actual_cpu_skinning_mesh_frame_comparison.json'))
          assert len(x['R36']['real_skinned_mesh_nodes'])==5
          assert len(x['R36']['unskinned_mesh_nodes'])==6
          assert len(x['mesh_local_pose_comparisons'])==3
          print('R37_REAL_MESH_SPACE_WEIGHTED_VERTICES_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: acnh-r37-real-playerbody-weighted-mesh-space-vertex-replay
          path: derived/3.0.3/r37_meshskin/
      - name: Commit measured CPU skinning evidence only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse derived/3.0.3/r37_meshskin/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(r37): 5 actual skinned mesh CPU vertex pose math versus R35 baseline'
          for n in 1 2 3 4 5 6; do
            git fetch origin feat/acnh303-round37-animation-pose-ibm-bgm-base
            git rebase FETCH_HEAD
            if git push origin HEAD:feat/acnh303-round37-animation-pose-ibm-bgm-base; then exit 0; fi
            sleep 1
          done
          exit 1
