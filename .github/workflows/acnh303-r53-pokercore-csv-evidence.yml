name: ACNH 3.0.3 | R53 verify PokerCore CSV names and 40 source gaps
on:
  push:
    branches: [3.0.3_Unpack]
    paths:
      - 'Scripts/acnh303_r53_client_csv_audit.py'
      - 'Scripts/test_acnh303_r53_client_csv_audit.py'
      - '.github/workflows/acnh303-r53-pokercore-csv-evidence.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: acnh303-r53-original-csv-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/
            /assets/evidence/rom-items/
          lfs: false
      - uses: actions/checkout@v4
        with:
          repository: 969981/ACNHPokerCore
          ref: 85e50a1ad182c926b2ebd51c00abc612e0a859d5
          path: upstream-pokercore
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ACNHPokerCore/csv/items.csv
            /ACNHPokerCore/csv/variations.csv
            /ACNHPokerCore/csv/field.csv
            /ACNHPokerCore/csv/override.csv
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test original PokerCore CSV file contract
        run: python -m unittest discover -s Scripts -p test_acnh303_r53_client_csv_audit.py -v
      - name: Cross-reference actual client id and iName with 344 native ROM images
        run: python Scripts/acnh303_r53_client_csv_audit.py --root .
      - name: Commit evidence only, never alter or rename ROM images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- assets/evidence/rom-items/r53-client-iname-id-and-40.json assets/evidence/rom-items/r53-client-iname-id-and-40.csv assets/evidence/rom-items/r53-remaining-40-client-csv.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'evidence: verify PokerCore CSV itemID and iName against 344 genuine ROM icon names'
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin 3.0.3_Unpack
            if ! git rebase origin/3.0.3_Unpack; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:3.0.3_Unpack; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
