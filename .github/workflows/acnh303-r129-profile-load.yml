name: ACNH 3.0.3 R129 profile load
on:
  pull_request:
    paths:
      - 'Scripts/acnh303_r129*'
      - 'derived/3.0.3/npc_event_flags/r129_profile_load/**'
      - '.github/workflows/acnh303-r129-profile-load.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify-r129:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/acnh303_r129_profile_load.py
            /Scripts/acnh303_r124_interface_registry.py
            /Scripts/acnh303_r123_cloud_interface.py
            /Scripts/acnh303_r122_backend_abi.py
            /Scripts/acnh303_r120_native_save.py
            /Scripts/acnh303_r119_save_dispatch.py
            /Scripts/acnh303_r100_nso_decode.py
            /Scripts/acnh303_r99_relocation.py
            /Scripts/acnh303_r96_native_tables.py
            /Scripts/acnh303_r95_native_eventflags.py
            /Scripts/acnh303_round11_elf_xref.py
            /derived/3.0.3/npc_event_flags/r129_profile_load/
            /derived/3.0.3/ghidra12.2/c/87/028c871c.c
            /derived/3.0.3/ghidra12.2/c/8a/028c8a30.c
            /derived/3.0.3/ghidra12.2/c/29/028c29b0.c
            /derived/3.0.3/ghidra12.2/c/5f/028b5ff0.c
            /derived/3.0.3/ghidra12.2/c/8b/028c8ba0.c
            /derived/3.0.3/ghidra12.2/c/6c/027b6c14.c
            /derived/3.0.3/ghidra12.2/c/63/028b63c0.c
            /e10617820db06889e1638499478da0de_NCA/0/main
            /e10617820db06889e1638499478da0de_NCA/0/main.elf
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install capstone==5.0.6 lz4==4.4.4 unicorn==2.1.4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/969981/ACNH_Resources/actions/artifacts/14897705515/zip > r128.zip
      - run: python Scripts/acnh303_r129_profile_load.py --r128 r128.zip --out artifacts/r129
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acnh303-r129-profile-load
          path: artifacts/r129/
          if-no-files-found: warn
