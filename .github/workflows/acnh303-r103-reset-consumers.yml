name: ACNH 3.0.3 R103 reset consumers
on:
  pull_request:
    paths:
      - 'Scripts/acnh303_r103*'
      - 'derived/3.0.3/npc_event_flags/r103_reset_consumers/**'
      - 'derived/3.0.3/npc_event_flags/semantics/field_semantics.json'
      - '.github/workflows/acnh303-r103-reset-consumers.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-r103:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/acnh303_r103_reset_consumers.py
            /Scripts/acnh303_r103_snapshot_compare.py
            /Scripts/acnh303_round11_elf_xref.py
            /derived/3.0.3/npc_event_flags/r103_reset_consumers/
            /derived/3.0.3/ghidra12.2/c/
            /e10617820db06889e1638499478da0de_NCA/0/main.elf
            /UnPack/1/Bcsv/EventFlagsLandTempParam.csv
            /UnPack/1/Bcsv/EventFlagsPlayerTempParam.csv
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install capstone==5.0.6
      - run: python Scripts/acnh303_r103_snapshot_compare.py --selftest
      - run: python Scripts/acnh303_r103_reset_consumers.py --root . --out artifacts/r103
      - uses: actions/upload-artifact@v4
        with:
          name: acnh303-r103-reset-consumers
          path: artifacts/r103/
          if-no-files-found: error
