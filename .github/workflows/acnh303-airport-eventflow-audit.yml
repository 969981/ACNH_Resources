name: ACNH 3.0.3 | R36 airport EventFlow audit
on:
  push:
    branches: [3.0.3_Unpack]
    paths:
      - 'Scripts/acnh303_airport_eventflow_audit.py'
      - '.github/workflows/acnh303-airport-eventflow-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/acnh303_airport_eventflow_audit.py
            /e10617820db06889e1638499478da0de_NCA/1/EventFlow/SNPC_dod_*.bfevfl
            /UnPack/1/EventFlow/SNPC_dod_*.json
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: acnh303-dialogue-msbt-audit
          run-id: 45352855792
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: r35
      - run: python -m py_compile Scripts/acnh303_airport_eventflow_audit.py
      - run: python Scripts/acnh303_airport_eventflow_audit.py --msbt-db r35/dialogue_msbt.sqlite3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acnh303-airport-eventflow-audit
          path: artifacts/acnh303-airport-eventflow/
          retention-days: 90
          if-no-files-found: error
