name: ACNH 3.0.3 | R70 pilot 200 original ClosetIcon PNGs
on:
  push:
    branches: [3.0.3_Unpack]
    paths:
      - '.github/workflows/acnh303-r70-closet-pilot.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: acnh303-r70-pilot-closet
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/
            /assets/evidence/rom-completeness/r68-original-layout-sources-without-extracted-png.csv
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original archive texture dependencies
        run: python -m pip install -r Scripts/requirements-media.txt
      - name: Determine exact first 200 new ClosetIcon source files
        shell: bash
        run: |
          set -euo pipefail
          python Scripts/acnh303_r69_native_layout_incremental.py plan --family ClosetIcon --start 0 --limit 200
          git sparse-checkout add --stdin < /tmp/acnh-closeticon-00000-sparse.txt
      - name: Download original decoder and verify published SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          u=https://github.com/quatric/nintoolbox/releases/download/nightly-20261028
          curl -fLsS --retry 3 "$u/nintoolbox-linux-x86_64.tar.gz" -o /tmp/nintoolbox-linux-x86_64.tar.gz
          curl -fLsS --retry 3 "$u/SHA256SUMS.txt" -o /tmp/SHA256SUMS.txt
          (cd /tmp && grep 'nintoolbox-linux-x86_64.tar.gz$' SHA256SUMS.txt | sha256sum -c -)
          mkdir -p /tmp/nintoolbox
          tar -xzf /tmp/nintoolbox-linux-x86_64.tar.gz -C /tmp/nintoolbox
          find /tmp/nintoolbox -type f -name wimgt | head -n1 > /tmp/wimgt.path
          test -s /tmp/wimgt.path
          chmod +x "$(cat /tmp/wimgt.path)"
      - name: Decode 200 original closet images and record all real source outcomes
        shell: bash
        run: python Scripts/acnh303_r69_native_layout_incremental.py extract --family ClosetIcon --start 0 --limit 200 --decoder "$(cat /tmp/wimgt.path)"
      - name: Save source audit and original PNGs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acnh-r70-closet-pilot-native
          path: |
            assets/evidence/rom-completeness/native-layout-batches/
            assets/images/clothing-original-layout/ClosetIcon/
            assets/textures/completion-original-layout/
          retention-days: 30
          if-no-files-found: warn
      - name: Commit source-backed PNG and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -A -- assets/evidence/rom-completeness/native-layout-batches/
          for d in assets/images/clothing-original-layout/ClosetIcon assets/textures/completion-original-layout; do
            if [ -d "$d" ]; then git add --sparse -A -- "$d"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'assets: native 3.0.3 ClosetIcon original PNG pilot 00000-00200'
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin 3.0.3_Unpack
            if ! git rebase origin/3.0.3_Unpack; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:3.0.3_Unpack; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
