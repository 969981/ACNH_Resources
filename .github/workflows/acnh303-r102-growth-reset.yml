name: ACNH 3.0.3 R102 growth reset callers
on:
  pull_request:
    paths:
      - 'Scripts/acnh303_r102*'
      - 'Scripts/gdb/acnh303_r102_reset_observer.py'
      - 'derived/3.0.3/npc_event_flags/r102_growth_reset/**'
      - '.github/workflows/acnh303-r102-growth-reset.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-r102:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/acnh303_r102_growth_reset.py
            /Scripts/acnh303_round11_elf_xref.py
            /Scripts/gdb/acnh303_r102_reset_observer.py
            /derived/3.0.3/npc_event_flags/r102_growth_reset/
            /derived/3.0.3/ghidra12.2/c/
            /derived/3.0.3/ghidra12.2/ndjson/batch-00000000/export-summary.json
            /e10617820db06889e1638499478da0de_NCA/0/main.elf
            /UnPack/1/Bcsv/EventFlagsPlayerParam.csv
            /UnPack/1/Bcsv/EventFlagsLandTempParam.csv
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install capstone==5.0.6
      - run: python -m py_compile Scripts/gdb/acnh303_r102_reset_observer.py
      - run: python Scripts/acnh303_r102_growth_reset.py --root . --out artifacts/r102
      - uses: actions/upload-artifact@v4
        with:
          name: acnh303-r102-growth-reset
          path: artifacts/r102/
          if-no-files-found: error
