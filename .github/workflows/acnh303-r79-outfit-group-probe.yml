name: ACNH 3.0.3 | R79 native outfit group multilingual name key probe
on:
  push:
    branches: [3.0.3_Unpack]
    paths:
      - 'Scripts/acnh303_r79_outfit_group_probe.py'
      - '.github/workflows/acnh303-r79-outfit-group-probe.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/acnh_formats.py
            /Scripts/acnh303_r75_original_message_npc_audit.py
            /Scripts/acnh303_r79_outfit_group_probe.py
            /UnPack/1/Bcsv/ItemClothGroup.csv
            /UnPack/1/Bcsv/ItemParam.csv
            /e10617820db06889e1638499478da0de_NCA/1/Message/String_CNzh.sarc.zs
            /e10617820db06889e1638499478da0de_NCA/1/Message/String_USen.sarc.zs
            /e10617820db06889e1638499478da0de_NCA/1/Message/String_JPja.sarc.zs
      - run: python -m pip install zstandard
      - run: python Scripts/acnh303_r79_outfit_group_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: acnh-r79-original-outfit-name-keys
          path: assets/evidence/rom-database/r79-outfit-name-native-group-probe.json
      - name: Commit original field and message key evidence
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -- assets/evidence/rom-database/r79-outfit-name-native-group-probe.json
          git commit -m 'research: identify original outfit group names vs clothing item IDs and image labels'
          for i in 1 2 3 4; do
            git fetch --no-tags origin 3.0.3_Unpack
            git rebase origin/3.0.3_Unpack
            if git push origin HEAD:3.0.3_Unpack; then exit 0; fi
            sleep 3
          done
          exit 1
