name: ACNH native occupancy and height
on:
  push:
    branches: [research]
    paths:
      - 'Scripts/acnh303_space_occupancy.py'
      - 'Scripts/acnh303_space_bones.py'
      - '.github/workflows/acnh303-space-occupancy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/acnh303_furniture_space.py
            /Scripts/acnh303_space_occupancy.py
            /Scripts/acnh303_space_bones.py
            /e10617820db06889e1638499478da0de_NCA/1/Model/FtrBabybed.Nin_NX_NVN.zs
            /e10617820db06889e1638499478da0de_NCA/1/Model/FtrLampJapan.Nin_NX_NVN.zs
            /e10617820db06889e1638499478da0de_NCA/1/Model/FtrBearS.Nin_NX_NVN.zs
            /e10617820db06889e1638499478da0de_NCA/1/Model/FtrMovingboxS.Nin_NX_NVN.zs
            /e10617820db06889e1638499478da0de_NCA/1/Model/FtrMovingboxM.Nin_NX_NVN.zs
            /e10617820db06889e1638499478da0de_NCA/1/Model/FtrMovingboxL.Nin_NX_NVN.zs
            /e10617820db06889e1638499478da0de_NCA/1/Model/FtrTableSquareSimpleS.Nin_NX_NVN.zs
            /e10617820db06889e1638499478da0de_NCA/1/Model/FtrTableSquareSimpleL.Nin_NX_NVN.zs
            /e10617820db06889e1638499478da0de_NCA/1/Model/FtrIronwoodKitchen.Nin_NX_NVN.zs
            /e10617820db06889e1638499478da0de_NCA/1/Model/FtrKitchenIsland.Nin_NX_NVN.zs
            /e10617820db06889e1638499478da0de_NCA/1/Model/FtrIceCounter.Nin_NX_NVN.zs
            /e10617820db06889e1638499478da0de_NCA/1/Model/FtrAltar.Nin_NX_NVN.zs
            /e10617820db06889e1638499478da0de_NCA/1/Bcsv/ItemParam.bcsv
      - uses: actions/checkout@v4
        with:
          repository: 969981/ACNH_Resources
          ref: b17b413c7344b85f46beb620f636ac98d6e988ba
          path: verified-tools
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/
            /e10617820db06889e1638499478da0de_NCA/0/main
            /e10617820db06889e1638499478da0de_NCA/0/main.elf
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lz4==4.4.4 capstone==5.0.6 unicorn==2.1.4 zstandard==0.25.0
      - run: PYTHONPATH="$PWD/verified-tools/Scripts" python Scripts/acnh303_space_occupancy.py --verified verified-tools --out result
      - run: PYTHONPATH="$PWD/verified-tools/Scripts" python Scripts/acnh303_space_bones.py --out result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: space-occupancy-evidence
          path: result/
          if-no-files-found: warn
