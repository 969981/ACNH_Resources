name: ACNH 3.0.3 | R64 original ELF exact UI string and ARM64 xref audit
on:
  push:
    branches: [3.0.3_Unpack]
    paths:
      - 'Scripts/acnh303_r64_ui_elf_refs.py'
      - '.github/workflows/acnh303-r64-ui-original-elf-xrefs.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: acnh303-r64-original-elf
  cancel-in-progress: false
jobs:
  xrefs:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/acnh303_r64_ui_elf_refs.py
            /assets/evidence/rom-items/r61-all-1254-original-native-sources.json
            /e10617820db06889e1638499478da0de_NCA/0/ACNH3.0.3.elf
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Hash verify original 3.0.3 ELF and scan exact string + ARM64 ADRP pairs
        run: python Scripts/acnh303_r64_ui_elf_refs.py
      - name: Commit only validated read-only original ELF analysis
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -A -- assets/evidence/rom-ui-semantics/r64-elf-original-ui-string-xrefs.json assets/evidence/rom-ui-semantics/r64-elf-original-ui-string-xrefs.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'evidence: scan SHA-verified 3.0.3 ELF strings and exact AArch64 UI references'
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin 3.0.3_Unpack
            if ! git rebase origin/3.0.3_Unpack; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:3.0.3_Unpack; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
