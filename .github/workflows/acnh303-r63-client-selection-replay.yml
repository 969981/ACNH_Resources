name: ACNH 3.0.3 | R63 pinned PokerCore native image selection static replay
on:
  push:
    branches: [3.0.3_Unpack]
    paths:
      - 'Scripts/acnh303_r63_pokercore_static_selection.py'
      - '.github/workflows/acnh303-r63-client-selection-replay.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: acnh303-r63-static-selection
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/
            /UnPack/1/Bcsv/ItemParam.csv
            /assets/catalog/
            /assets/evidence/rom-items/
            /assets/evidence/rom-clothing-layout/
          lfs: false
      - uses: actions/checkout@v4
        with:
          repository: 969981/ACNHPokerCore
          ref: 85e50a1ad182c926b2ebd51c00abc612e0a859d5
          path: upstream-pokercore
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ACNHPokerCore/Map/map.cs
            /ACNHPokerCore/csv/items.csv
            /ACNHPokerCore/csv/variations.csv
            /ACNHPokerCore/csv/field.csv
            /ACNHPokerCore/csv/override.csv
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Replay exactly guarded branches against native filename inventory
        run: python Scripts/acnh303_r63_pokercore_static_selection.py --root .
      - name: Commit static client selection, do not alter any image names
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- assets/evidence/rom-items/r63-pokercore-lookup-replay.json assets/evidence/rom-items/r63-pokercore-selection.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'evidence: replay pinned PokerCore ID, variation and fallback paths for 344, 39 and 391'
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin 3.0.3_Unpack
            if ! git rebase origin/3.0.3_Unpack; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:3.0.3_Unpack; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
