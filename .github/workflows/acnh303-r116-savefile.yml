name: ACNH 3.0.3 R116 savefile index
on:
  pull_request:
    paths:
      - 'Scripts/acnh303_r116*'
      - 'derived/3.0.3/npc_event_flags/r116_savefile_index/**'
      - '.github/workflows/acnh303-r116-savefile.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify-r116:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/acnh303_r116_savefile_index.py
            /Scripts/acnh303_r100_nso_decode.py
            /Scripts/acnh303_r99_relocation.py
            /Scripts/acnh303_r96_native_tables.py
            /Scripts/acnh303_r95_native_eventflags.py
            /Scripts/acnh303_round11_elf_xref.py
            /derived/3.0.3/npc_event_flags/r116_savefile_index/
            /derived/3.0.3/ghidra12.2/c/c6/0283c6a8.c
            /derived/3.0.3/ghidra12.2/c/cb/0283cba8.c
            /derived/3.0.3/ghidra12.2/c/6b/02836b14.c
            /derived/3.0.3/ghidra12.2/c/bf/0283bffc.c
            /derived/3.0.3/ghidra12.2/c/bd/0283bde0.c
            /derived/3.0.3/ghidra12.2/c/1c/02701c80.c
            /derived/3.0.3/ghidra12.2/c/b3/0283b370.c
            /derived/3.0.3/ghidra12.2/c/0e/02700ee8.c
            /derived/3.0.3/ghidra12.2/c/67/028367f0.c
            /derived/3.0.3/ghidra12.2/c/92/026f9208.c
            /derived/3.0.3/ghidra12.2/c/93/026f9328.c
            /derived/3.0.3/ghidra12.2/c/34/026f34d0.c
            /derived/3.0.3/ghidra12.2/c/37/026f3708.c
            /derived/3.0.3/ghidra12.2/c/3a/026f3ad0.c
            /derived/3.0.3/ghidra12.2/c/3d/026f3de0.c
            /derived/3.0.3/ghidra12.2/c/27/026f27c0.c
            /derived/3.0.3/ghidra12.2/c/d2/026ed290.c
            /derived/3.0.3/ghidra12.2/c/12/02701270.c
            /derived/3.0.3/ghidra12.2/c/14/027014c0.c
            /e10617820db06889e1638499478da0de_NCA/0/main
            /e10617820db06889e1638499478da0de_NCA/0/main.elf
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install capstone==5.0.6 lz4==4.4.4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/969981/ACNH_Resources/actions/artifacts/14891119060/zip > r115.zip
          gh api repos/969981/ACNH_Resources/actions/artifacts/14892055136/zip > r114.zip
      - run: python Scripts/acnh303_r116_savefile_index.py --root . --r115 r115.zip --r114 r114.zip --out artifacts/r116
      - uses: actions/upload-artifact@v4
        with:
          name: acnh303-r116-savefile-index
          path: artifacts/r116/
          if-no-files-found: error
