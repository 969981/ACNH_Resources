name: ACNH 3.0.3 | Real Model + BDLI priority wave

on:
  pull_request:
    paths:
      - 'Scripts/acnh303_priority_model_bdli.py'
      - 'Scripts/test_acnh303_priority_model_bdli.py'
      - 'Scripts/acnh303_history_sha_merge.py'
      - '.github/workflows/acnh303-priority-model-bdli.yml'
  push:
    branches: [3.0.3_Unpack]
    paths:
      - '.github/workflows/acnh303-priority-model-bdli.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: acnh303-priority-model-bdli
  cancel-in-progress: false

jobs:
  verify-real-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Sparse checkout scripts and audited historical source ledger
        uses: actions/checkout@v4
        with:
          filter: blob:none
          persist-credentials: true
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/
            /UnPack/_meta/history_sha_merge/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bounded Model and BDLI static parser requirements
        run: python -m pip install -r Scripts/requirements-media.txt

      - name: Tests and immutable source-selection preflight
        run: |
          python -m compileall -q Scripts
          python -m unittest discover -s Scripts -p 'test_acnh303_priority_model_bdli.py' -v
          python -m unittest discover -s Scripts -p 'test_acnh303_history_sha_merge.py' -v
          python Scripts/acnh303_priority_model_bdli.py select \
            --root . --shard 0 --shards 64 --per-category 12

      - name: Hydrate ONLY 24 selected immutable originals
        shell: bash
        run: |
          set -euo pipefail
          git sparse-checkout set --no-cone --stdin < priority_sparse_patterns.txt
          python - <<'PY'
          import json
          from pathlib import Path
          NCA = 'e10617820db06889e1638499478da0de_NCA'
          s=json.loads(Path('priority_selection.json').read_text('utf8'))
          assert len(s['sources'])==24
          assert {x['source_path'].split('/',1)[0] for x in s['sources']}=={'Model','BDLI'}
          assert all((Path(NCA)/'1'/x['source_path']).is_file() for x in s['sources'])
          print('Real original Git blobs hydrated:',len(s['sources']))
          PY

      - name: Verify Git blob SHA and original SHA-256; analyze bounded Model/BDLI structures
        run: |
          python Scripts/acnh303_priority_model_bdli.py run \
            --root . --selection priority_selection.json \
            --out priority_wave_model_bdli.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('priority_wave_model_bdli.json').read_text('utf8'))
          assert x['sample_count']==x['exact_original_git_blob_verified']==x['original_source_sha256_verified']==24
          assert x['category_counts']=={'BDLI':12,'Model':12}
          assert len({r['source_path'] for r in x['rows']})==24
          assert all(r['original_byte_and_git_identity_verified'] and len(r['source_sha256'])==64 for r in x['rows'])
          assert all(r['verified_media_outputs']==0 for r in x['rows'])
          assert x['native_runtime_evidence_captured'] is False
          assert x['media_conversion_performed'] is False
          print('Priority real-source wave passed: 12 Model + 12 BDLI; no false L3/Native claims')
          PY

      - name: Preserve exact source-level evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acnh303-real-model-bdli-${{ github.run_id }}
          path: |
            priority_selection.json
            priority_wave_model_bdli.json
          retention-days: 30
          if-no-files-found: warn

      - name: Commit verified original SHA report on default-branch run only
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          dst=UnPack/_meta/history_sha_merge/_inputs/priority_wave_model_bdli.json
          mkdir -p "$(dirname "$dst")"
          cp priority_wave_model_bdli.json "$dst"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$dst"
          if git diff --cached --quiet; then
            echo 'No new priority source evidence'
            exit 0
          fi
          git commit -m "data(acnh303): original-byte Model/BDLI verified source pilot"
          git fetch origin 3.0.3_Unpack
          git rebase origin/3.0.3_Unpack
          git push origin HEAD:3.0.3_Unpack

      - name: Explicitly dispatch original SHA ledger rebuild after priority evidence publication
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s UnPack/_meta/history_sha_merge/_inputs/priority_wave_model_bdli.json
          # GITHUB_TOKEN push commits do NOT trigger other push workflows.
          # workflow_dispatch is a GitHub-supported exception to that restriction.
          gh workflow run acnh303-historical-sha-ledger.yml \
            --ref 3.0.3_Unpack --repo "$GITHUB_REPOSITORY"
          echo 'Requested a verified-source-ledger recalculation (not yet claiming completion)'
