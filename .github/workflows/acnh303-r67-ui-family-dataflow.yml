name: ACNH 3.0.3 | R67 verify original ARM64 icon-family argument flow
on:
  push:
    branches: [3.0.3_Unpack]
    paths:
      - 'Scripts/acnh303_r67_native_ui_argument_flow.py'
      - '.github/workflows/acnh303-r67-ui-family-dataflow.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: acnh303-r67-original-UI-dataflow
  cancel-in-progress: false
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/acnh303_r67_native_ui_argument_flow.py
            /assets/evidence/rom-ui-semantics/
            /e10617820db06889e1638499478da0de_NCA/0/ACNH3.0.3.elf
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real ARM64 instruction decoder
        run: python -m pip install capstone
      - name: Validate exact source instruction sequence and call arguments
        run: python Scripts/acnh303_r67_native_ui_argument_flow.py
      - name: Commit source-backed argument flow and optional read-only GDB script
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -A -- assets/evidence/rom-ui-semantics/r67-ui-family-argument-dataflow.json assets/evidence/rom-ui-semantics/r67-ui-family-argument-dataflow.csv Scripts/gdb/acnh303_r67_ui_family_callsite_readonly.gdb
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'evidence: verify exact ARM64 UI family string-to-call argument flow and GDB read-only script'
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin 3.0.3_Unpack
            if ! git rebase origin/3.0.3_Unpack; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:3.0.3_Unpack; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
