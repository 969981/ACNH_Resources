name: ACNH 3.0.3 | R69 extract remaining 4 FtrIcon and GardeningIcon
on:
  push:
    branches: [3.0.3_Unpack]
    paths:
      - 'Scripts/acnh303_r69_native_layout_incremental.py'
      - '.github/workflows/acnh303-r69-four-native-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: acnh303-r69-four-sources
  cancel-in-progress: false
jobs:
  four-original:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/
            /assets/evidence/rom-completeness/r68-original-layout-sources-without-extracted-png.csv
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original BNTX container dependencies
        run: python -m pip install -r Scripts/requirements-media.txt
      - name: Plan exact four original ROM sources
        shell: bash
        run: |
          set -euo pipefail
          python Scripts/acnh303_r69_native_layout_incremental.py plan --family FtrIcon --start 0 --limit 1
          python Scripts/acnh303_r69_native_layout_incremental.py plan --family GardeningIcon --start 0 --limit 3
          (cat /tmp/acnh-ftricon-00000-sparse.txt; cat /tmp/acnh-gardeningicon-00000-sparse.txt) | git sparse-checkout add --stdin
      - name: Download hash-checked original BNTX texture converter
        shell: bash
        run: |
          set -euo pipefail
          u=https://github.com/quatric/nintoolbox/releases/download/nightly-20261028
          curl -fLsS --retry 3 "$u/nintoolbox-linux-x86_64.tar.gz" -o /tmp/nintoolbox-linux-x86_64.tar.gz
          curl -fLsS --retry 3 "$u/SHA256SUMS.txt" -o /tmp/SHA256SUMS.txt
          (cd /tmp && grep 'nintoolbox-linux-x86_64.tar.gz$' SHA256SUMS.txt | sha256sum -c -)
          mkdir -p /tmp/nintoolbox
          tar -xzf /tmp/nintoolbox-linux-x86_64.tar.gz -C /tmp/nintoolbox
          find /tmp/nintoolbox -type f -name wimgt | head -n1 > /tmp/wimgt.path
          test -s /tmp/wimgt.path
          chmod +x "$(cat /tmp/wimgt.path)"
      - name: Extract one missing FtrIcon with single/multi-BRTI evidence
        shell: bash
        run: python Scripts/acnh303_r69_native_layout_incremental.py extract --family FtrIcon --start 0 --limit 1 --decoder "$(cat /tmp/wimgt.path)"
      - name: Extract three missing GardeningIcon with source hashes
        shell: bash
        run: python Scripts/acnh303_r69_native_layout_incremental.py extract --family GardeningIcon --start 0 --limit 3 --decoder "$(cat /tmp/wimgt.path)"
      - name: Preserve native results even if individual sources cannot decode
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acnh-r69-four-native-originals
          path: |
            assets/evidence/rom-completeness/native-layout-batches/
            assets/images/completion-original-layout/
            assets/textures/completion-original-layout/
          retention-days: 30
          if-no-files-found: warn
      - name: Commit original only; preserve unresolved failures
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -A -- assets/evidence/rom-completeness/native-layout-batches/
          for d in assets/images/completion-original-layout assets/textures/completion-original-layout; do
            if [ -d "$d" ]; then git add --sparse -A -- "$d"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'assets: extract remaining four original FtrIcon and GardeningIcon source textures'
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin 3.0.3_Unpack
            if ! git rebase origin/3.0.3_Unpack; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:3.0.3_Unpack; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
