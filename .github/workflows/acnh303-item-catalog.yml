name: ACNH native item catalog
on:
  workflow_dispatch:
  push:
    branches: [research]
    paths: ['Scripts/bcsv/build_item_catalog.py','.github/workflows/acnh303-item-catalog.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Scripts/bcsv
            research/bcsv-data/decoded
            e10617820db06889e1638499478da0de_NCA/1/Message
      - uses: actions/checkout@v4
        with:
          ref: f09e15460d02790060a374b2ad6ba569ba9b97ed
          path: historical
          sparse-checkout: |
            Scripts
            assets/evidence/rom-database/r75-original-14-language-archives-and-npc-names.json
      - uses: astral-sh/setup-uv@v6
      - run: uv run --script Scripts/bcsv/build_item_catalog.py --historical historical
      - uses: actions/upload-artifact@v4
        with:
          name: acnh303-native-item-catalog
          path: out/catalog
  publish:
    needs: build
    if: github.ref == 'refs/heads/research'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research
          sparse-checkout: |
            research/catalog
      - uses: actions/download-artifact@v4
        with:
          name: acnh303-native-item-catalog
          path: /tmp/catalog
      - run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          for p in Scripts/bcsv/build_item_catalog.py Scripts/bcsv/bcsv.py Scripts/bcsv/export_views.py research/bcsv-data/decoded e10617820db06889e1638499478da0de_NCA/1/Message research/catalog; do
            test "$(git rev-parse "$GITHUB_SHA:$p")" = "$(git rev-parse "HEAD:$p")" || { echo "Input or destination changed: $p"; exit 1; }
          done
          mkdir -p research/catalog
          cp /tmp/catalog/*.csv /tmp/catalog/*.json research/catalog/
          # SQLite is a downloadable CI artifact; versioned CSV is canonical.
          git add research/catalog
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data(catalog): publish native item projections and original locale evidence"
          git push origin HEAD:research
