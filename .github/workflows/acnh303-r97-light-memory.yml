name: ACNH 3.0.3 R97 light memory and native dispatch evidence
on:
  pull_request:
    paths:
      - 'Scripts/acnh303_r97*'
      - 'derived/3.0.3/npc_event_flags/r97/**'
      - '.github/workflows/acnh303-r97-light-memory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-r97:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/acnh303_r95_native_eventflags.py
            /Scripts/acnh303_r96_save_flags.py
            /Scripts/acnh303_r96_native_tables.py
            /Scripts/acnh303_r97_save_flags.py
            /Scripts/acnh303_r97_native_dispatch.py
            /Scripts/acnh303_round11_elf_xref.py
            /derived/3.0.3/npc_event_flags/
            /derived/3.0.3/ghidra12.2/c/
            /derived/3.0.3/ghidra12.2/ndjson/batch-00000000/export-summary.json
            /e10617820db06889e1638499478da0de_NCA/0/main.elf
            /UnPack/1/EventFlow/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: R97 synthetic light memory and corruption tests
        run: python Scripts/acnh303_r97_save_flags.py --root . --selftest
      - name: Original native and EventFlow evidence
        run: python Scripts/acnh303_r97_native_dispatch.py --root . --out artifacts/acnh303-r97
      - uses: actions/upload-artifact@v4
        with:
          name: acnh303-r97-light-memory-reward-dispatch
          path: artifacts/acnh303-r97/
          if-no-files-found: error
          retention-days: 90
