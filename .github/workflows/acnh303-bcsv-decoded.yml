name: ACNH BCSV decoded layer
on:
  workflow_dispatch:
  push:
    branches: [research]
    paths: ['Scripts/bcsv/decode.py','.github/workflows/acnh303-bcsv-decoded.yml']
permissions:
  contents: read
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Scripts/bcsv
            research/bcsv-data
            research/bcsv-catalog
            research/bcsv-hash/sources
            docs/Items/Native-UI-Category-Groups.json
            e10617820db06889e1638499478da0de_NCA/1/Bcsv
      - uses: actions/checkout@v4
        with:
          repository: acnhmodding/HeavenTool
          ref: 74e0f967f6305c4aa55b1e1726c0445e45593c36
          path: upstream-heaven
          sparse-checkout: HeavenTool.IO/extra/hashes/enum
      - uses: actions/checkout@v4
        with:
          ref: f09e15460d02790060a374b2ad6ba569ba9b97ed
          path: historical
          sparse-checkout: assets/evidence/rom-database
      - uses: astral-sh/setup-uv@v6
      - run: uv run --no-project --python 3.12 python -m unittest discover -s Scripts/bcsv -p 'test_*.py'
      - run: uv run --script Scripts/bcsv/decode.py --upstream upstream-heaven --archive historical/assets/evidence/rom-database --out out/bcsv-decoded
      - uses: actions/upload-artifact@v4
        with:
          name: acnh303-bcsv-decoded
          path: out/bcsv-decoded
  publish:
    needs: decode
    if: github.ref == 'refs/heads/research'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research
          sparse-checkout: |
            research/bcsv-data
      - uses: actions/download-artifact@v4
        with:
          name: acnh303-bcsv-decoded
          path: /tmp/bcsv-decoded
      - run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          for p in Scripts/bcsv/decode.py Scripts/bcsv/bcsv.py Scripts/bcsv/export_views.py research/bcsv-data/schema research/bcsv-catalog/inventory.json research/bcsv-catalog/reference-candidates.json research/bcsv-hash/sources/external_enum_sources.json docs/Items/Native-UI-Category-Groups.json e10617820db06889e1638499478da0de_NCA/1/Bcsv research/bcsv-data/decoded; do
            test "$(git rev-parse "$GITHUB_SHA:$p")" = "$(git rev-parse "HEAD:$p")" || { echo "Input or destination changed: $p"; exit 1; }
          done
          mkdir -p research/bcsv-data/decoded
          cp -r /tmp/bcsv-decoded/. research/bcsv-data/decoded/
          git add research/bcsv-data/decoded
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data(bcsv): publish decoded typed tables and evidence sidecars"
          git push origin HEAD:research
