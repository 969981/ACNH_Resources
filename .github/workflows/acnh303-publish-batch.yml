name: ACNH 3.0.3 Publish Verified BCSV and BYML

on:
  push:
    branches: [feat/acnh-303-unpack]
    paths:
      - "scripts/**"
      - ".github/workflows/acnh303-publish-batch.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: acnh303-publish-branch
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          filter: blob:none
          sparse-checkout: |
            scripts
            Unpack
            e10617820db06889e1638499478da0de_NCA/1/Bcsv
            e10617820db06889e1638499478da0de_NCA/1/Stage
            e10617820db06889e1638499478da0de_NCA/1/AnimationInfo
          sparse-checkout-cone-mode: true
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regression tests
        run: python -m unittest discover -s scripts -p "test_acnh_unpack.py" -v
      - name: Convert real BCSV and BYML into mirrored Unpack
        run: |
          python scripts/unpack_acnh.py --root . --out Unpack --kind tables --resume --strict
          python scripts/unpack_acnh.py --root . --out Unpack --kind byml --resume --strict
          python scripts/unpack_acnh.py --root . --out Unpack --verify --strict
      - name: Publish converted text files and verified manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Unpack
          if git diff --cached --quiet; then
            echo "No new converted files."
          else
            git commit -m "data(unpack): publish source-mirrored ACNH 3.0.3 BCSV BYML outputs"
            git push origin HEAD:feat/acnh-303-unpack
          fi
