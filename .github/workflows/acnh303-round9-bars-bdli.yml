name: ACNH 3.0.3 Round 9 BARS AMTA and BDLI Lossless Sections
on:
  push:
    branches:
      - feat/acnh303-round9-bars-bdli-sections
    paths:
      - .github/workflows/acnh303-round9-bars-bdli.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/requirements.txt -r scripts/requirements-media.txt
      - name: Require Python syntax validity of every round9 decoder
        run: python -m py_compile scripts/acnh303_bars_audio_l3.py scripts/acnh303_bars_amta_export.py scripts/acnh303_bdli_section_export.py scripts/acnh303_round9_reconcile.py
      - name: Verify native binary boundaries and byte exact output
        run: python -m unittest discover -s scripts -p "test_acnh303_round9_native.py" -v
  bars:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/requirements-media.txt
      - name: Select 4 new .bars originals; skip previously tested 8 in shard zero
        shell: bash
        run: |
          skip=0
          if [ "${{ matrix.shard }}" = "0" ]; then skip=8; fi
          python scripts/select_acnh303_shard.py --category Sound \
            --shard ${{ matrix.shard }} --shards 8 --suffix .bars \
            --skip-count "$skip" --max-count 4
          python - <<'PY'
          import json
          s=json.load(open('selection.json'))
          assert s['selected_files']==4 and len(set(s['paths']))==4,s
          PY
      - name: Fetch known vgmstream r2117 build and record tool fingerprint
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 https://github.com/vgmstream/vgmstream/releases/download/r2117/vgmstream-linux.zip -o /tmp/vgmstream.zip
          mkdir -p /tmp/vgmstream
          unzip -q /tmp/vgmstream.zip -d /tmp/vgmstream
          find /tmp/vgmstream -type f -name 'vgmstream-cli*' | head -1 > /tmp/vgmstream.path
          test -s /tmp/vgmstream.path
          chmod +x "$(cat /tmp/vgmstream.path)"
          sha256sum /tmp/vgmstream.zip "$(cat /tmp/vgmstream.path)"
      - name: Actually extract native BARS BWAV and decode readable PCM WAVs
        run: |
          python scripts/acnh303_bars_audio_l3.py --selection selection.json \
            --out Unpack_BARS_Round9 \
            --report derived/3.0.3/round9_shards/bars_${{ matrix.shard }} \
            --tool-vgmstream "$(cat /tmp/vgmstream.path)"
      - name: Independently export exact AMTA member bytes and bounded structures
        run: |
          python scripts/acnh303_bars_amta_export.py --selection selection.json \
            --out Unpack_AMTA_Round9 \
            --report derived/3.0.3/round9_shards/amta_${{ matrix.shard }}
      - name: Rehash real WAV and native AMTA output files
        run: |
          python - <<'PY'
          import json,hashlib,pathlib,glob
          entries=glob.glob('derived/3.0.3/round9_shards/*/report.json')
          assert len(entries)==2,entries
          for file in entries:
              report=json.load(open(file))
              assert len(report['records'])==4
              for source in report['records']:
                  p=pathlib.Path('e10617820db06889e1638499478da0de_NCA/1')/source['source_path']
                  assert hashlib.sha256(p.read_bytes()).hexdigest()==source['source_sha256']
                  for member in source['members']:
                      if member['status']=='converted_pcm_wav':
                          path=pathlib.Path(member['output_path'])
                          assert hashlib.sha256(path.read_bytes()).hexdigest()==member['output_sha256']
                          assert member['validation']['frames']>0
                      elif member['status']=='lossless_amta_extracted':
                          path=pathlib.Path(member['output_path'])
                          assert hashlib.sha256(path.read_bytes()).hexdigest()==member['amta_sha256']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round9-bars-report-${{ matrix.shard }}
          path: derived/3.0.3/round9_shards/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round9-bars-native-files-${{ matrix.shard }}
          path: |
            Unpack_BARS_Round9/
            Unpack_AMTA_Round9/
          retention-days: 14
          compression-level: 2
          if-no-files-found: warn
  bdli:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/requirements.txt
      - name: Select 8 genuine BDLI Zstd sources without full RomFS checkout
        run: |
          python scripts/select_acnh303_shard.py --category BDLI \
            --shard ${{ matrix.shard }} --shards 8 --suffix .zs \
            --skip-count 0 --max-count 8
      - name: Decompress and export real LBLI raw bytes with per-section hash
        run: |
          python scripts/acnh303_bdli_section_export.py \
            --selection selection.json --out Unpack_BDLI_Sections \
            --report derived/3.0.3/round9_shards/bdli_${{ matrix.shard }}
      - name: Rehash each original and extracted LBLI section from artifact tree
        run: |
          python - <<'PY'
          import pathlib,hashlib,json,glob
          reports=glob.glob('derived/3.0.3/round9_shards/bdli_*/report.json')
          assert len(reports)==1
          data=json.load(open(reports[0]))
          assert len(data['records'])==8
          for rec in data['records']:
              src=pathlib.Path('e10617820db06889e1638499478da0de_NCA/1')/rec['source_path']
              assert hashlib.sha256(src.read_bytes()).hexdigest()==rec['source_sha256']
              for section in rec['sections']:
                  if section['status']=='raw_extracted':
                      f=pathlib.Path(section['output_path'])
                      assert hashlib.sha256(f.read_bytes()).hexdigest()==section['sha256']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round9-bdli-report-${{ matrix.shard }}
          path: derived/3.0.3/round9_shards/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round9-bdli-native-files-${{ matrix.shard }}
          path: Unpack_BDLI_Sections/
          retention-days: 14
          compression-level: 2
          if-no-files-found: warn
  reconcile:
    needs: [regression,bars,bdli]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            derived/3.0.3/bars_audio_round8
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: round9-*-report-*
          path: collected
          merge-multiple: false
      - name: Cross-check 8+4 manifest shards, original hashes and PCM evidence
        run: |
          python scripts/acnh303_round9_reconcile.py --collected collected \
            --round8-bars derived/3.0.3/bars_audio_round8/report.json \
            --out derived/3.0.3/round9_cumulative
      - name: Commit verified report only after all shard jobs and reconcile pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -A derived/3.0.3/round9_cumulative
          git diff --cached --quiet && exit 0
          git commit -m "data(acnh303): verified 32 new BARS and 32 BDLI LBLI section origins"
          git fetch origin feat/acnh303-round9-bars-bdli-sections
          git rebase FETCH_HEAD
          git push origin HEAD:feat/acnh303-round9-bars-bdli-sections
