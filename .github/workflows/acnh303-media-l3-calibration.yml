name: ACNH 3.0.3 Media L3 Six-Shard Calibration
on:
  push:
    branches: [feat/acnh303-media-l3]
    paths: [".github/workflows/acnh303-media-l3-calibration.yml"]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        include:
          - {group: Model, shard: 0, shards: 32, suffix: ".zs"}
          - {group: Model, shard: 1, shards: 32, suffix: ".zs"}
          - {group: Layout, shard: 0, shards: 8, suffix: ".zs"}
          - {group: Layout, shard: 1, shards: 8, suffix: ".zs"}
          - {group: Sound, shard: 0, shards: 8, suffix: ".bwav"}
          - {group: Sound, shard: 1, shards: 8, suffix: ".bwav"}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r scripts/requirements-media.txt
      - name: Select deterministic source files without downloading the rest of 10GB RomFS
        run: >
          python scripts/select_acnh303_shard.py
          --category "${{ matrix.group }}"
          --shard ${{ matrix.shard }}
          --shards ${{ matrix.shards }}
          --suffix "${{ matrix.suffix }}"
          --max-count 6
      - name: Install verified native media decoders once for this shard
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.group }}" == "Sound" ]]; then
            curl -fLsS --retry 3 \
              "https://github.com/vgmstream/vgmstream/releases/download/r2117/vgmstream-linux.zip" \
              -o /tmp/vgmstream-linux.zip
            mkdir -p /tmp/vgmstream
            unzip -q /tmp/vgmstream-linux.zip -d /tmp/vgmstream
            find /tmp/vgmstream -type f -name 'vgmstream-cli*' | head -n 1 > /tmp/vgmstream.path
            test -s /tmp/vgmstream.path
            chmod +x "$(cat /tmp/vgmstream.path)"
          else
            n="https://github.com/quatric/nintoolbox/releases/download/nightly-20261013"
            curl -fLsS --retry 3 "$n/nintoolbox-linux-x86_64.tar.gz" -o /tmp/nintoolbox-linux-x86_64.tar.gz
            curl -fLsS --retry 3 "$n/SHA256SUMS.txt" -o /tmp/SHA256SUMS.txt
            (cd /tmp && grep 'nintoolbox-linux-x86_64.tar.gz$' SHA256SUMS.txt | sha256sum -c -)
            mkdir -p /tmp/nintoolbox
            tar -xzf /tmp/nintoolbox-linux-x86_64.tar.gz -C /tmp/nintoolbox
            find /tmp/nintoolbox -type f -name wmdlt | head -n 1 > /tmp/wmdlt.path
            find /tmp/nintoolbox -type f -name wimgt | head -n 1 > /tmp/wimgt.path
            test -s /tmp/wmdlt.path && test -s /tmp/wimgt.path
            chmod +x "$(cat /tmp/wmdlt.path)" "$(cat /tmp/wimgt.path)"
          fi
          echo wmdlt >/tmp/default-wmdlt.path
          echo wimgt >/tmp/default-wimgt.path
          echo vgmstream-cli >/tmp/default-vgmstream.path
      - name: Convert every selected leaf and preserve per-file success/failure reasons
        shell: bash
        run: |
          test -f /tmp/wmdlt.path || cp /tmp/default-wmdlt.path /tmp/wmdlt.path
          test -f /tmp/wimgt.path || cp /tmp/default-wimgt.path /tmp/wimgt.path
          test -f /tmp/vgmstream.path || cp /tmp/default-vgmstream.path /tmp/vgmstream.path
          python scripts/acnh303_media_batch.py --root . --selection selection.json \
            --out Unpack_L3_Batch --report-dir derived/3.0.3/media_calibration \
            --tool-wmdlt "$(cat /tmp/wmdlt.path)" \
            --tool-wimgt "$(cat /tmp/wimgt.path)" \
            --tool-vgmstream "$(cat /tmp/vgmstream.path)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-l3-report-${{ matrix.group }}-${{ matrix.shard }}
          path: |
            derived/3.0.3/media_calibration/
            selection.json
          retention-days: 30
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-l3-output-${{ matrix.group }}-${{ matrix.shard }}
          path: Unpack_L3_Batch/
          compression-level: 3
          retention-days: 14
          if-no-files-found: warn
  audit:
    needs: [convert]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: derived
          sparse-checkout-cone-mode: true
      - uses: actions/download-artifact@v4
        with:
          pattern: media-l3-report-*
          path: collected
          merge-multiple: true
      - name: Persist measured conversion outcomes, not a claimed full corpus conversion
        run: |
          python - <<'PY'
          import collections,json,os,pathlib
          path=pathlib.Path("collected")
          manifests=sorted(path.rglob("manifest.json"))
          summaries=sorted(path.rglob("summary.json"))
          all_rows=[item for p in manifests for item in json.loads(p.read_text("utf-8"))]
          status=collections.Counter(r["status"] for r in all_rows)
          outputs=collections.Counter(r["format"] for r in all_rows for x in r["validated_outputs"])
          report={"run_id":os.environ["GITHUB_RUN_ID"],"expected_shards":6,"completed_shards":len(summaries),
                  "sampled_original_sources":len(all_rows),"status_counts":dict(status),
                  "validated_output_count_by_format":dict(outputs),
                  "validated_media_bytes":sum(x["size_bytes"] for r in all_rows for x in r["validated_outputs"]),
                  "limitations":"This is a bounded calibration sample. All 103400 originals remain tracked separately; no claim of L3 complete."}
          target=pathlib.Path("derived/3.0.3/media_calibration_summary")
          target.mkdir(parents=True,exist_ok=True)
          (target/"latest.json").write_text(json.dumps(report,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          print(json.dumps(report,indent=2,ensure_ascii=False))
          if len(summaries)!=6:raise SystemExit("some media calibration shards missing")
          PY
      - name: Commit durable six-shard media conversion baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A derived/3.0.3/media_calibration_summary
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(acnh303): record real L3 media conversion calibration results"
          git fetch origin feat/acnh303-media-l3
          git rebase origin/feat/acnh303-media-l3
          git push origin HEAD:feat/acnh303-media-l3
