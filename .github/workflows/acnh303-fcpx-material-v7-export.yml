name: ACNH 3.0.3 Verify FCPX Native Record Table and mat1 Rendering Words
on:
  push:
    branches: [feat/acnh303-ui2d-native-v7]
    paths:
      - ".github/workflows/acnh303-fcpx-material-v7-export.yml"
      - "scripts/acnh303_ui2d_parser.py"
      - "scripts/test_acnh303_ui2d_parser.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            derived
            Unpack_UI2D_Font
          sparse-checkout-cone-mode: true
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r scripts/requirements-media.txt
      - name: Sparse-fetch exact 41 missing-BNTX Layout originals
        run: |
          python - <<'PY'
          import csv,pathlib,subprocess
          with pathlib.Path("derived/3.0.3/media_iteration4_cumulative/remaining.csv").open(newline="",encoding="utf-8") as f:
              names=sorted({r["source_path"] for r in csv.DictReader(f)
                            if r["state"]=="no_target_leaf" and r["source_path"].startswith("Layout/")})
          assert len(names)==41
          lines=["/scripts/","/derived/","/Unpack_UI2D_Font/"]+[
              "/e10617820db06889e1638499478da0de_NCA/1/"+name for name in names]
          subprocess.run(["git","sparse-checkout","set","--no-cone","--stdin"],
                         input=("\n".join(lines)+"\n").encode(),check=True)
          PY
      - name: Test bounded FLYT FLAN section parser
        run: |
          python -m compileall -q scripts/acnh303_ui2d_parser.py scripts/acnh303_ui2d_batch.py
          python -m unittest discover -s scripts -p 'test_acnh303_ui2d_parser.py' -v
          python -m unittest discover -s scripts -p 'test_acnh303_fcpx_font.py' -v
      - name: Export all 41 original archives with actual pane tree and animation JSON
        run: |
          python scripts/acnh303_ui2d_batch.py \
            --root . --out Unpack_UI2D_Font \
            --report derived/3.0.3/ui2d_font_v7_41 --strict
      - name: Require real 20 native font reference records and 22 original material words
        run: |
          python - <<'PY'
          import pathlib,json
          p=pathlib.Path("derived/3.0.3/ui2d_font_v7_41/summary.json")
          j=json.loads(p.read_text())
          assert j["source_count"]==41 and j["FLYT_structured"]==41
          assert j["FLAN_structured"]==21 and j["FCPX_font_references"]==12
          assert j["failed_leaf_count"]==0 and j["incomplete_other_type_count"]==0
          font_refs=set()
          mats=[]
          for source in j["source_records"]:
              for leaf in source["leaves"]:
                  if leaf.get("status")=="font_references_only":
                      d=json.loads(pathlib.Path(leaf["output"]).read_text())
                      assert d["font_reference_table"]["record_stride"]==40
                      assert len(d["fonts"]) in (9,11)
                      font_refs.update([d["file_sha256"]])
                      for row in d["fonts"]:
                          assert row["offset"]==row["name_pointer_raw"]+24
                  if leaf.get("kind")=="bflyt":
                      doc=json.loads(pathlib.Path(leaf["output"]).read_text())
                      for block in doc["material_parts_control_metadata"]["materials"]:
                          for m in block["items"]:
                              assert m["byte_size"]==44
                              assert len(m["native_words_u32_le"])==4
                              mats.append(m)
          assert len(font_refs)==2 and len(mats)==22,(len(font_refs),len(mats))
          print("VERIFIED 12 FCPX native record indexes, 2 real unique font blobs, 22 material v9 word groups")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acnh303-41-layout-native-fcpx-mat1-verified-json
          path: |
            Unpack_UI2D_Font/
            derived/3.0.3/ui2d_font_v7_41/
          retention-days: 30
          if-no-files-found: warn
      - name: Commit per-source FLYT FLAN structure/animation JSON to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -A Unpack_UI2D_Font derived/3.0.3/ui2d_font_v7_41
          git diff --cached --quiet && exit 0
          git commit -m "data(acnh303): re-export 41 native FLYT JSONs with exact FCPX pointer records and material color words"
          for i in 1 2 3 4; do
            git fetch origin feat/acnh303-ui2d-native-v7
            git rebase origin/feat/acnh303-ui2d-native-v7
            if git push origin HEAD:feat/acnh303-ui2d-native-v7; then exit 0; fi
            sleep 3
          done
          exit 1
