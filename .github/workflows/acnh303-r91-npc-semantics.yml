name: ACNH 3.0.3 R91 NPC Looks and Race Static Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Scripts/acnh303_r91_nmlnpc_semantics.py'
      - 'UnPack/1/Bcsv/NmlNpcParam.csv'
      - 'UnPack/1/Bcsv/NpcLooksParam.csv'
      - 'UnPack/1/Bcsv/NmlNpcRaceParam.csv'
      - '.github/workflows/acnh303-r91-npc-semantics.yml'

jobs:
  source-verified-npc-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout only relevant original evidence and analyzer
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Scripts/acnh303_r91_nmlnpc_semantics.py
            UnPack/1/Bcsv/NmlNpcParam.csv
            UnPack/1/Bcsv/NmlNpcParam.json
            UnPack/1/Bcsv/NpcLooksParam.csv
            UnPack/1/Bcsv/NmlNpcRaceParam.csv
            e10617820db06889e1638499478da0de_NCA/1/Bcsv/NmlNpcParam.bcsv
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce R91 mappings, original BCSV byte identity and distributions
        run: python Scripts/acnh303_r91_nmlnpc_semantics.py --root . --out artifacts/acnh303-r91
      - name: Assert semantic evidence boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/acnh303-r91')
          m=json.loads((p/'nmlnpc_looks_race_manifest.json').read_text('utf-8'))
          d=json.loads((p/'villager_native_static_semantics.json').read_text('utf-8'))
          assert m['population'] == 417 and m['looks_join_exact'] == 417
          assert m['race_code_joins'] == 417 and m['race_codes_observed'] == 35
          assert m['native_BCSV_loader_to_runtime_cache_full_call_chain_verified'] is False
          assert len(d) == 417 and all(not x['native_runtime_consumer_fully_verified'] for x in d)
          assert sum(m['native_looks_counts'].values()) == 417
          assert sum(m['gender_groups'].values()) == 417
          print('R91 source verification and runtime safety gates passed')
          PY
      - name: Upload inspectable original-source analysis
        uses: actions/upload-artifact@v4
        with:
          name: acnh303-r91-nmlnpc-static-semantics
          path: artifacts/acnh303-r91/
          if-no-files-found: error
