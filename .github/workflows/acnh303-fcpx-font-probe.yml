name: ACNH 3.0.3 FCPX Font Real-Source Binary Probe
on:
  push:
    branches: [feat/acnh303-fcpx-ui2d-bwav6]
    paths: [".github/workflows/acnh303-fcpx-font-probe.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: true
          sparse-checkout: |
            scripts
            derived
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r scripts/requirements-media.txt
      - name: Sparse-fetch exact 41 formerly BNTX-missing Layout original files
        run: |
          python - <<'PY'
          import csv,subprocess,pathlib
          with pathlib.Path("derived/3.0.3/media_iteration4_cumulative/remaining.csv").open(newline="",encoding="utf-8") as f:
              s=sorted({r["source_path"] for r in csv.DictReader(f)
                        if r["state"]=="no_target_leaf" and r["source_path"].startswith("Layout/")})
          assert len(s)==41
          paths=["/scripts/","/derived/"]+["/e10617820db06889e1638499478da0de_NCA/1/"+x for x in s]
          subprocess.run(["git","sparse-checkout","set","--no-cone","--stdin"],
              input=("\n".join(paths)+"\n").encode(),check=True)
          PY
      - name: Inspect actual font binaries and compare deduplication, magic/offsets
        run: python scripts/acnh303_fcpx_font_probe.py
      - name: Save verifiable per-source and per-font SHA evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -A derived/3.0.3/fcpx_font_probe
          git diff --cached --quiet && exit 0
          git commit -m "research(font): inspect 12 genuine FCPX native leaves and unique subformats"
          git fetch origin feat/acnh303-fcpx-ui2d-bwav6
          git rebase FETCH_HEAD
          git push origin HEAD:feat/acnh303-fcpx-ui2d-bwav6
