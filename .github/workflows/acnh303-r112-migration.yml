name: ACNH 3.0.3 R112 migration thunk
on:
  pull_request:
    paths:
      - 'Scripts/acnh303_r112*'
      - 'derived/3.0.3/npc_event_flags/r112_migration_thunk/**'
      - '.github/workflows/acnh303-r112-migration.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify-r112:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/acnh303_r112_migration_thunk.py
            /Scripts/acnh303_r100_nso_decode.py
            /Scripts/acnh303_r99_relocation.py
            /Scripts/acnh303_r96_native_tables.py
            /Scripts/acnh303_r95_native_eventflags.py
            /Scripts/acnh303_round11_elf_xref.py
            /derived/3.0.3/npc_event_flags/r112_migration_thunk/
            /derived/3.0.3/ghidra12.2/c/94/026f9460.c
            /derived/3.0.3/ghidra12.2/c/d7/026fd710.c
            /derived/3.0.3/ghidra12.2/c/cb/028bcb18.c
            /e10617820db06889e1638499478da0de_NCA/0/main
            /e10617820db06889e1638499478da0de_NCA/0/main.elf
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install capstone==5.0.6 lz4==4.4.4
      - name: Fetch source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/969981/ACNH_Resources/actions/artifacts/14888082289/zip > r111.zip
          gh api repos/969981/ACNH_Resources/actions/artifacts/14883517767/zip > r105.zip
          gh api repos/969981/ACNH_Resources/actions/artifacts/14886157356/zip > r109.zip
          gh api repos/969981/ACNH_Resources/actions/artifacts/14881442847/zip > r100.zip
      - run: python Scripts/acnh303_r112_migration_thunk.py --root . --r111 r111.zip --r105 r105.zip --r109 r109.zip --r100 r100.zip --out artifacts/r112
      - uses: actions/upload-artifact@v4
        with:
          name: acnh303-r112-migration-thunk
          path: artifacts/r112/
          if-no-files-found: error
