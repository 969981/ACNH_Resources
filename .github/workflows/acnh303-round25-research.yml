name: ACNH303 R25 Bind Pose and Real ELF Imported Call Chain
on:
  push:
    branches: [feat/acnh303-round25-bindpose-native-consumers]
    paths:
      - '.github/workflows/acnh303-round25-research.yml'
      - 'scripts/acnh303_round25_*.py'
      - 'scripts/test_acnh303_round25_*.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: acnh303-r25-bindpose-native
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /scripts/
            /derived/3.0.3/r24_model_skeleton/
            /derived/3.0.3/r24_native_loader/
            /e10617820db06889e1638499478da0de_NCA/0/ACNH3.0.3.elf
          sparse-checkout-cone-mode: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/requirements-media.txt "pyelftools>=0.31,<1" "capstone>=5,<6"
      - name: R25 synthetics and SHA-backed R24 numeric regression
        run: python -m unittest discover -s scripts -p 'test_acnh303_round25_research.py' -v
      - name: Regenerate 57 model inverse-bind verification and shared-skeleton matrices
        run: python scripts/acnh303_round25_bindpose.py
      - name: Re-evaluate BNSH callers and true import relocation symbols in ORIGINAL ELF
        run: python scripts/acnh303_round25_bnsh_callers.py
      - name: Guard all reported result labels against overstatement
        run: |
          python - <<'PY'
          import json
          b=json.load(open('derived/3.0.3/r25_bind_pose/bind_pose_audit.json'))
          n=json.load(open('derived/3.0.3/r25_native_bnsh/native_bnsh_callers.json'))
          assert b['total_inverse_matrices_checked']==57 and b['all_57_ZYX_pass_1e_4']
          p=b['cross_model_with_PlayerBody']['PlayerBottomsPantsNormal']
          assert (p['shared_name_count'],p['exact_base_TRS_count'],
                  p['identical_inverse_matrix_SHA256_count'])==(15,15,13)
          assert n['original_elf_sha256']=='83970061788f10049e2e60d687571b8dc87e5014521889ac4611a7f6b9c6e180'
          assert len(n['BNSH_static_source_calls'])==3
          assert 'UNPROVEN' in b['verification_state']
          assert 'UNPROVEN' in n['verification_state']
          print("R25 validated",b['total_inverse_matrices_checked'],
                len(n['BNSH_static_source_calls']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: acnh303-r25-source-grounded-audit-json
          path: |
            derived/3.0.3/r25_bind_pose/bind_pose_audit.json
            derived/3.0.3/r25_native_bnsh/native_bnsh_callers.json
          if-no-files-found: error
      - name: Commit only generated audit reports to dedicated branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse derived/3.0.3/r25_bind_pose/bind_pose_audit.json derived/3.0.3/r25_native_bnsh/native_bnsh_callers.json
          if git diff --cached --quiet; then
            echo 'Audits already in branch'; exit 0
          fi
          git commit -m 'data(r25): SHA-backed bindpose and BNSH ELF consumer triage'
          git push origin HEAD:feat/acnh303-round25-bindpose-native-consumers
