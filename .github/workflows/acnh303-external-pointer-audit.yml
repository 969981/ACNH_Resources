name: ACNH 3.0.3 external pointer ELF audit
on:
  workflow_dispatch:
  push:
    branches: [3.0.3_Unpack]
    paths:
      - Scripts/acnh303_external_pointer_audit.py
      - derived/3.0.3/external_pointers/candidates.json
      - .github/workflows/acnh303-external-pointer-audit.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/acnh303_external_pointer_audit.py
            /derived/3.0.3/external_pointers/candidates.json
            /UnPack/0/main.elf
            /e10617820db06889e1638499478da0de_NCA/0/main.elf
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install capstone==5.0.6
      - run: python Scripts/acnh303_external_pointer_audit.py --root . --out artifacts/external-pointer-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: acnh303-external-pointer-audit
          path: artifacts/external-pointer-audit.json
          if-no-files-found: error
          retention-days: 90
