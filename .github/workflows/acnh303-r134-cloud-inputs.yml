name: ACNH 3.0.3 R134 cloud inputs
on:
  pull_request:
    paths:
      - 'Scripts/acnh303_r134*'
      - 'derived/3.0.3/npc_event_flags/r134_cloud_inputs/**'
      - '.github/workflows/acnh303-r134-cloud-inputs.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify-r134:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Scripts/acnh303_r134_cloud_inputs.py
            /Scripts/acnh303_r124_interface_registry.py
            /Scripts/acnh303_r123_cloud_interface.py
            /Scripts/acnh303_r122_backend_abi.py
            /Scripts/acnh303_r120_native_save.py
            /Scripts/acnh303_r119_save_dispatch.py
            /Scripts/acnh303_r100_nso_decode.py
            /Scripts/acnh303_r99_relocation.py
            /Scripts/acnh303_r96_native_tables.py
            /Scripts/acnh303_r95_native_eventflags.py
            /Scripts/acnh303_round11_elf_xref.py
            /derived/3.0.3/npc_event_flags/r134_cloud_inputs/
            /derived/3.0.3/ghidra12.2/c/9e/01c79ed0.c
            /derived/3.0.3/ghidra12.2/c/9a/01c79a24.c
            /derived/3.0.3/ghidra12.2/c/a5/01c7a574.c
            /derived/3.0.3/ghidra12.2/c/cf/01c7cf1c.c
            /derived/3.0.3/ghidra12.2/c/c8/01c7c808.c
            /e10617820db06889e1638499478da0de_NCA/0/main
            /e10617820db06889e1638499478da0de_NCA/0/main.elf
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install capstone==5.0.6 lz4==4.4.4 unicorn==2.1.4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/969981/ACNH_Resources/actions/artifacts/14901988731/zip > r133.zip
      - run: python Scripts/acnh303_r134_cloud_inputs.py --r133 r133.zip --out artifacts/r134
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acnh303-r134-cloud-inputs
          path: artifacts/r134/
          if-no-files-found: warn
