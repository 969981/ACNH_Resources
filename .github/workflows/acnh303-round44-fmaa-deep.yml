name: ACNH R44 FMAA native material animation header deep validation
on:
  push:
    branches: [feat/acnh303-round44-model-fmaa-aal-provenance]
    paths:
      - '.github/workflows/acnh303-round44-fmaa-deep.yml'
      - 'scripts/acnh303_round44_fmaa_deep.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  native_fmaa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            derived
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/requirements-media.txt
      - name: Verify exact original Cedar bytes and parse true 0x70 FMAA headers
        run: |
          set -euo pipefail
          printf '/scripts/\n/derived/\n/e10617820db06889e1638499478da0de_NCA/1/Model/PltTreeCedarDecoAnim.Nin_NX_NVN.zs\n' |
            git sparse-checkout set --no-cone --stdin
          python scripts/acnh303_round44_fmaa_deep.py --out derived/3.0.3/r44_fmaa_deep/cedar_native_FMAA_headers.json
      - uses: actions/upload-artifact@v4
        with:
          name: r44-cedar-fmaa-original-header-proof
          path: derived/3.0.3/r44_fmaa_deep/cedar_native_FMAA_headers.json
          if-no-files-found: error
      - name: Commit compact original-source structural evidence without media blobs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse derived/3.0.3/r44_fmaa_deep/cedar_native_FMAA_headers.json
          git commit -m 'data(r44): SHA-bound Cedar 2 native FMAA records and header fields'
          for attempt in 1 2 3 4 5; do
            git fetch origin feat/acnh303-round44-model-fmaa-aal-provenance
            git rebase FETCH_HEAD
            if git push origin HEAD:feat/acnh303-round44-model-fmaa-aal-provenance; then exit 0; fi
            sleep 1
          done
          exit 1
